<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BINGO DO CEMTEC</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0a1024; --card:#121e3d; --line:#22314f;
    --azul:#4f9bff; --txt:#eaf0ff; --dim:#8fa2c7;
    --marinho:#0B2F6B; --ciano:#1BA7EC;
    --cel:44px; --bola:180px;
  }
  html,body{height:100%;overflow:hidden}
  body{
    display:grid;grid-template-rows:auto minmax(0,1fr) auto;
    gap:8px;padding:10px 12px;
    background:radial-gradient(ellipse at 50% 0%, #14224a 0%, var(--bg) 62%);
    color:var(--txt);font-family:system-ui,'Segoe UI',Roboto,sans-serif;
  }
  body:fullscreen{padding:12px 15px}

  header{display:flex;align-items:center;gap:8px;min-height:50px;flex-wrap:wrap}

  .brand{
    background:#fff;border-radius:11px;padding:4px 10px;
    display:flex;align-items:center;justify-content:center;
    flex:0 0 auto;box-shadow:0 3px 16px rgba(0,0,0,.42);
  }
  .brand img{
    display:block;height:clamp(26px,3.1vh,38px);width:auto;
    max-width:min(210px,23vw);object-fit:contain;
  }
  @media(max-width:900px){ .brand img{max-width:125px} }

  .titulo{
    font-size:clamp(12px,1.5vw,23px);font-weight:900;
    letter-spacing:.055em;color:#fff;white-space:nowrap;
    line-height:1;flex:0 0 auto;
  }
  .titulo span{color:var(--ciano)}
  @media(max-width:840px){ .titulo{display:none} }

  .spacer{flex:1;min-width:6px}
  .pill{
    border:1px solid var(--azul);border-radius:999px;
    padding:5px 13px;font-size:clamp(10px,.9vw,13px);
    font-weight:700;color:var(--azul);white-space:nowrap;
  }
  .pill.bingo{
    border-color:#ff5b5b;color:#ff8585;background:rgba(198,40,40,.18);
    animation:piscaPill 1s ease-in-out infinite;
  }
  @keyframes piscaPill{50%{opacity:.55}}
  .icobtn{
    width:39px;height:39px;border:1px solid var(--line);border-radius:11px;
    background:var(--card);color:var(--dim);cursor:pointer;
    display:grid;place-items:center;transition:.15s;flex:0 0 auto;
  }
  .icobtn:hover{color:var(--txt);border-color:#3a5480}
  .icobtn.on{color:var(--azul);border-color:var(--azul);background:#132a52;
    box-shadow:0 0 14px rgba(79,155,255,.28)}
  .icobtn.alertaOn{color:#ffd84d;border-color:#ffd84d;background:#3a2f0d;
    box-shadow:0 0 14px rgba(255,216,77,.35)}
  .icobtn.passadorOn{color:#37d67a;border-color:#37d67a;background:#0f2e1c;
    box-shadow:0 0 16px rgba(55,214,122,.45)}
  .icobtn.travaOn{color:#b57bff;border-color:#b57bff;background:#2a1a4a;
    box-shadow:0 0 16px rgba(181,123,255,.42)}
  .icobtn svg{width:18px;height:18px;fill:none;stroke:currentColor;
    stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  main{display:grid;grid-template-columns:minmax(0,2.35fr) minmax(245px,.72fr);
    gap:10px;min-height:0}
  @media(max-width:1040px){
    main{grid-template-columns:minmax(0,2.1fr) minmax(210px,.8fr)}
  }

  .placar{
    position:relative;
    background:linear-gradient(180deg,#0d1730,#0a1226);
    border:1px solid var(--line);border-radius:16px;
    padding:8px;display:flex;flex-direction:column;
    justify-content:center;min-height:0;overflow:hidden;
    transition:box-shadow .35s, border-color .35s;
  }
  .placar.quente{
    border-color:rgba(232,113,10,.65);
    box-shadow:0 0 0 1px rgba(232,113,10,.45),
               0 0 34px rgba(232,113,10,.22) inset;
  }
  .placar.urgente{
    border-color:rgba(255,216,77,.85);
    box-shadow:0 0 0 2px rgba(255,216,77,.55),
               0 0 46px rgba(255,216,77,.30) inset;
    animation:bordaPulsa 1.15s ease-in-out infinite;
  }
  .placar.parado{
    border-color:rgba(255,91,91,.9);
    box-shadow:0 0 0 3px rgba(255,91,91,.7),
               0 0 60px rgba(255,91,91,.35) inset;
    animation:bordaPulsaBingo 1s ease-in-out infinite;
  }
  @keyframes bordaPulsa{
    0%,100%{box-shadow:0 0 0 2px rgba(255,216,77,.45),
                        0 0 26px rgba(255,216,77,.16) inset}
    50%{box-shadow:0 0 0 3px rgba(255,216,77,.9),
                    0 0 58px rgba(255,216,77,.42) inset}
  }
  @keyframes bordaPulsaBingo{
    0%,100%{box-shadow:0 0 0 3px rgba(255,91,91,.5),
                        0 0 34px rgba(255,91,91,.2) inset}
    50%{box-shadow:0 0 0 4px rgba(255,91,91,1),
                    0 0 70px rgba(255,91,91,.5) inset}
  }

  .grade{display:flex;flex-direction:column;gap:5px;
    align-items:center;justify-content:center;flex:1;min-height:0;
    padding-top:20px}
  .linha{display:flex;align-items:center;gap:5px;justify-content:center}
  .letra{
    width:calc(var(--cel)*.86);height:calc(var(--cel)*.86);flex:0 0 auto;
    border-radius:10px;background:linear-gradient(160deg,#2f6fd0,#1b4a99);
    display:grid;place-items:center;font-weight:800;
    font-size:calc(var(--cel)*.46);color:#fff;
    box-shadow:0 2px 8px rgba(0,0,0,.35);
  }
  .cel{
    width:var(--cel);height:var(--cel);flex:0 0 auto;
    border-radius:50%;display:grid;place-items:center;
    font-weight:800;font-size:calc(var(--cel)*.38);
    position:relative;overflow:hidden;
    background:#1b2543;color:#3b4b70;
    transition:transform .18s, box-shadow .25s, background .25s,
               color .25s, filter .25s;
  }
  .cel.aceso{
    color:#fff;background:var(--cor);
    box-shadow:inset 0 -3px 8px rgba(0,0,0,.55),
               inset 0 3px 6px rgba(255,255,255,.24),
               0 3px 9px rgba(0,0,0,.5);
  }
  .cel .brilho{position:absolute;inset:0;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle at 30% 24%,
      rgba(255,255,255,.9), rgba(255,255,255,0) 46%)}
  .cel .n{position:relative;z-index:2;
    text-shadow:0 0 2px rgba(0,0,0,.85), 0 1px 3px rgba(0,0,0,.9)}
  .cel.aceso.listrada::before{
    content:'';position:absolute;left:-12%;right:-12%;
    top:30%;height:40%;background:#fff;z-index:1;
  }
  .cel.aceso.listrada .n{color:#1a1a1a;
    text-shadow:0 1px 0 rgba(255,255,255,.6)}
  .cel.piscando{
    color:#1a1200;background:#ffd84d;transform:scale(1.16);
    box-shadow:0 0 20px 5px rgba(255,216,77,.8);z-index:5;
  }
  .cel.piscando .n{text-shadow:none}
  .cel.marcado{
    opacity:1;filter:brightness(.96) saturate(1);
    box-shadow:inset 0 -3px 8px rgba(0,0,0,.5),
               inset 0 3px 6px rgba(255,255,255,.2),
               0 3px 9px rgba(0,0,0,.45),
               0 0 9px rgba(255,255,255,.10);
  }
  .cel.marcado .n{
    text-shadow:0 0 2px rgba(0,0,0,.9), 0 1px 3px rgba(0,0,0,.95);
  }
  .cel.atual{
    transform:scale(1.18);z-index:6;
    box-shadow:0 0 0 3px rgba(79,155,255,.95),
               0 0 28px 9px rgba(79,155,255,.6),
               inset 0 -3px 8px rgba(0,0,0,.5);
  }

  .alerta{
    position:absolute;left:50%;top:7px;
    transform:translateX(-50%) translateY(-18px) scale(.8);
    padding:9px 22px;border-radius:999px;
    font-weight:900;font-size:clamp(10px,1.08vw,16px);
    letter-spacing:.04em;white-space:nowrap;max-width:96%;
    overflow:hidden;text-overflow:ellipsis;
    opacity:0;pointer-events:none;z-index:40;
    transform-origin:center top;
  }
  .alerta.show{opacity:1}
  .alerta.n2{background:linear-gradient(90deg,#ff9d3d,#e8710a);color:#fff;
    box-shadow:0 8px 26px rgba(232,113,10,.55);
    animation:entraPula .48s cubic-bezier(.2,1.5,.4,1) both,
              pulsa 1.6s ease-in-out .55s infinite}
  .alerta.n1{background:linear-gradient(90deg,#ffe27a,#ffc400);color:#241a00;
    box-shadow:0 0 32px rgba(255,216,77,.95);
    animation:entraPula .48s cubic-bezier(.2,1.5,.4,1) both,
              pulsaRapido .85s ease-in-out .5s infinite}
  .alerta.n0{background:linear-gradient(90deg,#37d67a,#0f9d58);color:#04240f;
    box-shadow:0 0 34px rgba(55,214,122,.95);
    animation:entraPula .48s cubic-bezier(.2,1.5,.4,1) both,
              pulsaRapido .8s ease-in-out .5s infinite}
  .alerta.np{background:linear-gradient(90deg,#3a86d4,#1b4a99);color:#fff;
    box-shadow:0 8px 26px rgba(58,134,212,.55);
    animation:entraPula .48s cubic-bezier(.2,1.5,.4,1) both}
  .alerta.npk{background:linear-gradient(90deg,#ff5b5b,#c62828);color:#fff;
    box-shadow:0 8px 30px rgba(198,40,40,.7);
    animation:entraPula .48s cubic-bezier(.2,1.5,.4,1) both,
              pulsaRapido .9s ease-in-out .5s infinite}
  @keyframes entraPula{
    0%{opacity:0;transform:translateX(-50%) translateY(-22px) scale(.75)}
    55%{opacity:1;transform:translateX(-50%) translateY(2px) scale(1.09)}
    75%{transform:translateX(-50%) translateY(0) scale(.97)}
    100%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
  }
  @keyframes pulsa{
    0%,100%{transform:translateX(-50%) scale(1)}
    50%{transform:translateX(-50%) scale(1.035)}
  }
  @keyframes pulsaRapido{
    0%,100%{transform:translateX(-50%) scale(1)}
    50%{transform:translateX(-50%) scale(1.055)}
  }
  .alerta.show::after{
    content:'';position:absolute;top:0;bottom:0;width:36%;
    left:-45%;pointer-events:none;
    background:linear-gradient(100deg,transparent,
      rgba(255,255,255,.55),transparent);
    animation:varre 2.1s ease-in-out infinite;
  }
  @keyframes varre{0%{left:-45%}55%,100%{left:115%}}

  .painel{
    background:linear-gradient(180deg,#101c3a,#0b1428);
    border:1px solid var(--line);border-radius:16px;
    padding:10px 9px;display:flex;flex-direction:column;
    align-items:center;gap:6px;min-height:0;overflow:hidden;
  }
  .rotulo{font-size:9.5px;letter-spacing:.19em;color:var(--azul);
    font-weight:800;margin-bottom:-2px}

  .selo-letra{
    width:clamp(36px,4.4vh,52px);height:clamp(36px,4.4vh,52px);
    border-radius:12px;flex:0 0 auto;
    background:linear-gradient(160deg,#2f6fd0,#1b4a99);
    display:grid;place-items:center;
    font-size:clamp(18px,2.2vh,27px);font-weight:900;color:#fff;
    box-shadow:0 3px 12px rgba(31,111,208,.5),
               inset 0 2px 5px rgba(255,255,255,.25);
    line-height:1;
  }
  .selo-letra.vazio{background:#1b2543;color:#3b4b70;
    box-shadow:inset 0 0 0 1px var(--line)}

  .bola{
    width:var(--bola);height:var(--bola);
    aspect-ratio:1/1;min-width:var(--bola);min-height:var(--bola);
    flex:0 0 auto;flex-shrink:0;border-radius:50%;
    position:relative;overflow:hidden;display:grid;place-items:center;
    background:#16223f;color:#3b4b70;
    box-shadow:inset 0 -9px 20px rgba(0,0,0,.6),
               inset 0 9px 15px rgba(255,255,255,.16),
               0 10px 28px rgba(0,0,0,.55);
    transition:.3s;
  }
  .bola.aceso{background:var(--cor);color:#fff}
  .bola .brilho{position:absolute;inset:0;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle at 30% 22%,
      rgba(255,255,255,.88), rgba(255,255,255,0) 44%)}
  .bola.aceso.listrada::before{
    content:'';position:absolute;left:-12%;right:-12%;
    top:30%;height:40%;background:#fff;z-index:1;
  }
  .bola.aceso.listrada .n{color:#1a1a1a;
    text-shadow:0 2px 0 rgba(255,255,255,.55)}
  .bola .n{
    position:relative;z-index:2;font-weight:800;line-height:1;
    font-size:calc(var(--bola)*.40);
    text-shadow:0 0 4px rgba(0,0,0,.9), 0 2px 7px rgba(0,0,0,.95);
  }
  .bola.vazia .n{font-size:calc(var(--bola)*.115);font-weight:600;
    color:#5a6f96;text-shadow:none;text-align:center;padding:0 14px;
    line-height:1.4}
  .frase{
    font-size:clamp(10.5px,1.05vw,15.5px);line-height:1.36;text-align:center;
    color:#dbe6ff;max-width:100%;min-height:2.6em;
    display:flex;align-items:center;justify-content:center;
    padding:0 3px;
  }
  .frase.ativa{color:#fff;font-weight:600}
  .ultimos{margin-top:auto;width:100%}
  .ultimos .t{font-size:8.5px;letter-spacing:.15em;color:var(--dim);
    margin-bottom:5px;font-weight:700}
  .ultimos .lista{display:flex;gap:5px;flex-wrap:wrap}
  .mini{
    width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
    font-size:12px;font-weight:800;color:#fff;position:relative;
    overflow:hidden;background:var(--cor);
    box-shadow:inset 0 -2px 4px rgba(0,0,0,.5);flex:0 0 auto;
  }
  .mini.listrada::before{
    content:'';position:absolute;left:-12%;right:-12%;top:31%;height:38%;
    background:#fff;z-index:1;
  }
  .mini span{position:relative;z-index:2;text-shadow:0 0 2px #000}
  .mini.listrada span{color:#1a1a1a;text-shadow:0 1px 0 rgba(255,255,255,.5)}

  footer{display:flex;gap:6px;align-items:stretch;flex-wrap:wrap}
  button{font-family:inherit;cursor:pointer;transition:.15s;border-radius:11px}
  .btn{
    background:var(--card);border:1px solid var(--line);color:#cdd9f0;
    padding:0 11px;height:44px;font-size:11px;font-weight:600;
    letter-spacing:.02em;
  }
  .btn:hover{background:#17264a;border-color:#39547f;color:#fff}
  .btn:active{transform:scale(.97)}
  .btn:focus-visible,.icobtn:focus-visible{
    outline:2px solid var(--azul);outline-offset:2px}
  .sortear{
    flex:1 1 150px;min-width:140px;height:56px;border:none;
    background:linear-gradient(180deg,#4f9bff,#2f74db);
    color:#fff;font-size:16px;font-weight:800;letter-spacing:.12em;
    box-shadow:0 7px 22px rgba(79,155,255,.38);
    transition:.2s;
  }
  .sortear:hover{background:linear-gradient(180deg,#63a8ff,#3b81e8)}
  .sortear:active{transform:scale(.985)}
  .sortear:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
  .sortear.narrando{
    background:linear-gradient(180deg,#6a4fbf,#4b3390);
    box-shadow:0 0 0 2px rgba(181,123,255,.6),
               0 7px 22px rgba(181,123,255,.3);
    font-size:12px;letter-spacing:.07em;cursor:wait;
  }
  .sortear.narrando.agendado{
    background:linear-gradient(180deg,#8a5f2a,#6b4516);
    box-shadow:0 0 0 2px rgba(255,180,80,.7);
  }
  .sortear.paradoBtn{
    background:linear-gradient(180deg,#6b6b6b,#4a4a4a);
    box-shadow:none;font-size:12px;
  }
  .bingoBtn{
    flex:0 0 auto;min-width:112px;height:56px;border:none;
    background:linear-gradient(180deg,#ff5b5b,#c62828);
    color:#fff;font-size:15px;font-weight:900;letter-spacing:.1em;
    box-shadow:0 7px 22px rgba(198,40,40,.45);
  }
  .bingoBtn:hover{background:linear-gradient(180deg,#ff7373,#d93a3a)}
  .bingoBtn:active{transform:scale(.97)}
  .bingoBtn.ativo{
    animation:piscaBingo .9s ease-in-out infinite;
    box-shadow:0 0 0 3px rgba(255,91,91,.85),0 7px 26px rgba(198,40,40,.6);
  }
  @keyframes piscaBingo{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.055)}
  }
  select{
    background:var(--card);border:1px solid var(--line);color:#cdd9f0;
    border-radius:11px;padding:0 24px 0 10px;height:44px;font-size:11px;
    font-family:inherit;font-weight:600;cursor:pointer;
  }
  select:focus-visible{outline:2px solid var(--azul);outline-offset:2px}
  #selVeloc{height:38px;font-size:10.5px}
  #selVoz{height:38px;font-size:10.5px;max-width:215px}

  .overlay{
    position:fixed;inset:0;background:rgba(4,8,18,.86);
    backdrop-filter:blur(6px);display:none;place-items:center;
    padding:20px;z-index:100;
  }
  .overlay.show{display:grid}
  .modal{
    background:linear-gradient(180deg,#101c3a,#0a1226);
    border:1px solid #2c4370;border-radius:16px;
    width:min(660px,100%);max-height:90vh;display:flex;flex-direction:column;
    box-shadow:0 30px 80px rgba(0,0,0,.75);
  }
  .modal.bingoM{border-color:#c62828;
    box-shadow:0 0 0 2px rgba(198,40,40,.5),0 30px 80px rgba(0,0,0,.8)}
  .modal header{padding:15px 19px;border-bottom:1px solid var(--line)}
  .modal header h3{font-size:15px;letter-spacing:.04em}
  .modal .corpo{padding:17px 19px;overflow-y:auto}
  .modal footer{padding:13px 19px;border-top:1px solid var(--line);
    display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
  .modal p{font-size:13px;line-height:1.58;color:#c3d0e8}
  .modal label{display:block;font-size:11px;letter-spacing:.11em;
    color:var(--dim);margin-bottom:6px;font-weight:700}
  .modal input[type=number],.modal input[type=text]{
    width:100%;background:#0c1730;border:1px solid var(--line);
    border-radius:10px;padding:11px 13px;color:#fff;font-size:16px;
    font-family:inherit;font-weight:600;
  }
  .modal input:focus{outline:2px solid var(--azul);outline-offset:1px}
  .modal select{width:100%;height:46px}
  .aviso{font-size:11.5px;color:var(--dim);line-height:1.55;margin-top:9px}
  .aviso b{color:#cdd9f0}
  .resultado{
    margin-top:13px;padding:14px;border-radius:11px;text-align:center;
    font-weight:800;font-size:14px;letter-spacing:.06em;display:none;
  }
  .resultado.ok{display:block;background:rgba(30,142,62,.18);
    border:1px solid #1e8e3e;color:#5ddc85}
  .resultado.err{display:block;background:rgba(198,40,40,.18);
    border:1px solid #c62828;color:#ff8585}
  .resultado small{display:block;font-weight:500;font-size:11.5px;
    margin-top:7px;line-height:1.5;letter-spacing:0;opacity:.9}

  table.hist{width:100%;border-collapse:collapse;font-size:12.5px}
  table.hist th{text-align:left;color:var(--dim);font-size:10.5px;
    letter-spacing:.1em;padding:6px 8px;border-bottom:1px solid var(--line)}
  table.hist td{padding:6px 8px;border-bottom:1px solid rgba(34,49,79,.5);
    color:#d5e0f5}
  table.hist tr:last-child td{border-bottom:none}

  table.quentes{width:100%;border-collapse:collapse;font-size:12px;
    margin-top:10px}
  table.quentes th{text-align:left;color:var(--dim);font-size:10px;
    letter-spacing:.09em;padding:6px 7px;border-bottom:1px solid var(--line)}
  table.quentes td{padding:5px 7px;
    border-bottom:1px solid rgba(34,49,79,.5);color:#d5e0f5}
  table.quentes tr:last-child td{border-bottom:none}
  table.quentes td.f{text-align:right;font-weight:800;white-space:nowrap}
  table.quentes td.n{color:#9fb3d4;font-size:11.5px}
  table.quentes td.nm{color:#ffd84d;font-weight:700;font-size:11.5px}
  .q1{color:#ffd84d}
  .q2{color:#ffb066}

  .listaNomes{max-height:46vh;overflow-y:auto;margin-top:12px;
    border:1px solid var(--line);border-radius:10px}
  .linhaNome{display:flex;align-items:center;gap:10px;
    padding:8px 10px;border-bottom:1px solid rgba(34,49,79,.5)}
  .linhaNome:last-child{border-bottom:none}
  .cod{
    flex:0 0 auto;font-family:ui-monospace,Consolas,monospace;
    font-size:12px;font-weight:800;color:#9fc4ff;
    background:#1b2b4d;border:1px solid #2c4370;border-radius:6px;
    padding:4px 9px;min-width:52px;text-align:center;
  }
  .linhaNome input{
    flex:1;background:#0c1730;border:1px solid var(--line);
    border-radius:8px;padding:8px 11px;color:#fff;font-size:13.5px;
    font-family:inherit;font-weight:600;min-width:0;
  }
  .linhaNome input:focus{outline:2px solid var(--azul);outline-offset:1px}
  .linhaNome input::placeholder{color:#4a5f88;font-weight:500}

  .minicart{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;
    margin-top:14px;max-width:280px;margin-left:auto;margin-right:auto}
  .minicart div{
    aspect-ratio:1;display:grid;place-items:center;border-radius:6px;
    background:#0c1730;border:1px solid #1d2e50;font-size:11px;

  o.type='square'; o.frequency.value = 620 + p*520;
  g.gain.setValueAtTime(0.055 + p*0.03, c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0008, c.currentTime+0.05);
  o.connect(g).connect(c.destination);

  const f = c.createBiquadFilter(); f.type='bandpass'; f.Q.value=1.1;
  f.frequency.setValueAtTime(700, c.currentTime);
  f.frequency.linearRampToValueAtTime(1900, c.currentTime+dur);
  const g = c.createGain();
  g.gain.setValueAtTime(0.0001, c.currentTime);
  g.gain.linearRampToValueAtTime(0.13, c.currentTime+0.14);

const temSintese = ('speechSynthesis' in window);
let vozEscolhida = null;

function ehPtBR(v){
  if(!v || !v.lang) return false;
  return v.lang.toLowerCase().replace('_','-') === 'pt-br';
}
function listarVozesPtBR(){
  if(!temSintese) return [];
  return speechSynthesis.getVoices().filter(ehPtBR)
    .sort((a,b)=>a.name.localeCompare(b.name));
}
function montarSeletorVoz(){
  const sel = document.getElementById('selVoz');
  if(!sel) return;
  if(!temSintese){
    sel.innerHTML = '<option>Voz indisponível</option>';
    sel.disabled = true; return;
  }
  const vozes = listarVozesPtBR();
  if(!vozes.length){
    sel.innerHTML = '<option>Nenhuma voz pt-BR</option>';
    sel.disabled = true; vozEscolhida = null; return;
  }
  sel.disabled = false; sel.innerHTML = '';
  vozes.forEach(v=>{
    const op = document.createElement('option');
    op.value = v.name; op.textContent = v.name; op.title = v.name;
    sel.appendChild(op);
  });
  let idx = 0;
  if(S.vozNome){
    const i = vozes.findIndex(v => v.name === S.vozNome);
    if(i >= 0) idx = i;
  }
  sel.selectedIndex = idx;
  vozEscolhida = vozes[idx];
  S.vozNome = vozEscolhida.name;
}
function inicializarVozes(){

let tokenFala = 0;
function falarBlocos(blocos){
  if(!temSintese || !blocos.length){ marcarFalando(false); return; }
  const meu = ++tokenFala;
  try{ speechSynthesis.cancel(); }catch(e){}

  marcarFalando(true);

  let i = 0;
  const seguir = ()=>{
    if(meu !== tokenFala) return;
    if(i >= blocos.length){
      setTimeout(()=>{ if(meu === tokenFala) marcarFalando(false); }, 120);
      return;
    }
    const b = blocos[i++];
    if(b.pausa != null){ setTimeout(seguir, b.pausa); return; }

    const u = new SpeechSynthesisUtterance(b.texto);
    if(vozEscolhida){ u.voice = vozEscolhida; u.lang = 'pt-BR'; }
    else{ u.lang = 'pt-BR'; }
    u.rate = b.rate || S.velocidade;
    u.pitch = b.pitch || 1.0;
    u.volume = b.volume || 1;

    let concluido = false;
    const avancar = ()=>{
      if(concluido) return;
      concluido = true;
      if(meu !== tokenFala) return;
      setTimeout(seguir, 150);
    };
    u.onend = avancar; u.onerror = avancar;
    try{ speechSynthesis.speak(u); }
    catch(e){ avancar(); return; }
    setTimeout(avancar, Math.max(1400, b.texto.length * 105));
  };
  setTimeout(seguir, 260);
}
function falarCurto(texto){ falarBlocos([{texto: texto}]); }

function narrarNumero(n, al){
  const temNumero = S.voz;
  const temAlerta = S.vozAlerta && al && al.fala;
  if(!temNumero && !temAlerta){ marcarFalando(false); return; }
  const blocos = [];
  if(temNumero){
    blocos.push({texto:'Letra ' + letraDe(n) + '.'});
    blocos.push({pausa:1100});
    blocos.push({texto:FRASES[n-1] + '.'});
    blocos.push({pausa:1300});
    blocos.push({texto:'Número ' + extenso(n) + '.'});
  }
  if(temAlerta){
    if(blocos.length) blocos.push({pausa:750});
    blocos.push({texto: al.fala,
      rate: Math.min(1.05, S.velocidade + 0.14),
      pitch: al.nivel === 1 ? 1.16 : 1.08});
  }
  falarBlocos(blocos);
}

/* ---------- PLACAR ---------- */
const placar = document.getElementById('placar');
const grade = document.getElementById('grade');
function montarPlacar(){
  grade.innerHTML = '';
  for(let l=0; l<5; l++){
    const linha = document.createElement('div');
    linha.className = 'linha';
    const letra = document.createElement('div');
    letra.className = 'letra';
    letra.textContent = 'BINGO'[l];
    linha.appendChild(letra);
    for(let c=0; c<15; c++){
      const n = l*15 + c + 1;
      const cel = document.createElement('div');
      cel.className = 'cel';
      cel.dataset.n = n;
      cel.innerHTML = '<div class="brilho"></div><span class="n">'+n+'</span>';
      linha.appendChild(cel);
    }
    grade.appendChild(linha);
  }
  ajustarTamanho();
  pintarPlacar();
}
function celulaDe(n){ return grade.querySelector('.cel[data-n="'+n+'"]'); }
function setEstado(n, estado){
  const el = celulaDe(n); if(!el) return;
  const {cor, listrada} = estilo(n);
  el.classList.remove('marcado','atual','piscando','aceso','listrada');
  if(estado === 'apagado'){ el.style.removeProperty('--cor'); return; }
  el.classList.add('aceso');
  el.style.setProperty('--cor', cor);
  if(listrada) el.classList.add('listrada');
  if(estado === 'piscando') el.classList.add('piscando');
  if(estado === 'marcado')  el.classList.add('marcado');
  if(estado === 'atual')    el.classList.add('atual');
}
function pintarPlacar(){
  const set = new Set(S.sorteados.map(x=>x.n));
  for(let n=1; n<=75; n++){
    if(n === S.atual) setEstado(n,'atual');
    else if(set.has(n)) setEstado(n,'marcado');
    else setEstado(n,'apagado');
  }
}

function ajustarTamanho(){
  const r = placar.getBoundingClientRect();
  if(!r.width || !r.height) return;
  const pad = 16, gap = 5, letraFrac = 0.86;
  const wCel = (r.width - pad - gap*16) / (15 + letraFrac);
  const hCel = (r.height - pad - 24 - gap*4) / 5;
  const cel = Math.max(12, Math.floor(Math.min(wCel, hCel)));
  document.documentElement.style.setProperty('--cel', cel + 'px');
  const painel = document.querySelector('.painel');
  const pr = painel.getBoundingClientRect();
  const selo = document.getElementById('seloLetra');
  const seloH = selo ? selo.getBoundingClientRect().height : 0;
  const disp = pr.height - seloH - 95;
  const bola = Math.max(64, Math.min(pr.width - 24, disp));
  document.documentElement.style.setProperty('--bola', Math.floor(bola) + 'px');
}
window.addEventListener('resize', ()=>requestAnimationFrame(ajustarTamanho));
window.addEventListener('orientationchange', ()=>setTimeout(ajustarTamanho, 220));

/* =====================================================================
   ANÁLISE DA CARTELA
   Em "Linha ou coluna" avalia as 5 linhas E as 5 colunas e devolve
   TODOS os números de TODOS os grupos que estão na melhor situação.
   Ex.: se a cartela fecha a linha 1 com o 50 OU a coluna 3 com o 6,
   devolve nums = [6, 50] e faltam = 1.
   ===================================================================== */
const PADROES = {
  cantos: [0,4,20,24],
  x:      [0,4,6,8,12,16,18,20,24],
  borda:  [0,1,2,3,4,5,9,10,14,15,19,20,21,22,23,24],
  cheia:  Array.from({length:25},(_,i)=>i)
};
const NOME_PADRAO = {cantos:'Quatro cantos', x:'X', borda:'Borda',
                     linha:'Linha ou coluna', cheia:'Cartela cheia'};

function analisar(cartela, set, padrao){
  if(padrao === 'linha'){
    const grupos = [];
    for(let l=0; l<5; l++){
      const nums = [];
      for(let c=0; c<5; c++){
        const v = cartela[l*5+c];
        if(v === null) continue;
        if(!set.has(v)) nums.push(v);
      }
      grupos.push(nums);
    }
    for(let c=0; c<5; c++){
      const nums = [];
      for(let l=0; l<5; l++){
        const v = cartela[l*5+c];
        if(v === null) continue;
        if(!set.has(v)) nums.push(v);
      }
      grupos.push(nums);
    }
    let min = 99;
    grupos.forEach(g=>{ if(g.length < min) min = g.length; });
    const uniao = [];
    grupos.forEach(g=>{
      if(g.length === min){
        g.forEach(n=>{ if(!uniao.includes(n)) uniao.push(n); });
      }
    });
    const falta = uniao.sort((a,b)=>a-b);
    return {valido: min === 0, faltam: min, nums: falta};
  }

  const nums = [];
  PADROES[padrao].forEach(i=>{
    const v = cartela[i];
    if(v === null) return;
    if(!set.has(v) && !nums.includes(v)) nums.push(v);
  });
  const falta = nums.slice().sort((a,b)=>a-b);
  return {valido: falta.length === 0, faltam: falta.length, nums: falta};
}

/* ---------- formatação das listas de números ---------- */
function listaFalta(nums, limite){
  const arr = (nums || []).slice().sort((a,b)=>a-b);
  const lim = limite || 4;
  if(!arr.length) return '';
  if(arr.length === 1) return 'o ' + arr[0];
  if(arr.length === 2) return 'o ' + arr[0] + ' ou o ' + arr[1];
  if(arr.length <= lim){
    const cab = arr.slice(0, arr.length-1).join(', ');
    return 'o ' + cab + ' ou o ' + arr[arr.length-1];
  }
  const cab = arr.slice(0, lim).join(', ');
  return 'o ' + cab + ' ou outro';
}

/* ---------- ALERTA ---------- */
let ultimoIdx = {0:-1, 1:-1, 2:-1};
let alertaAtual = {nivel:-1, ts:0};

function escolhe(arr, nivel){
  if(arr.length === 1) return arr[0];
  let i = Math.floor(Math.random()*arr.length);
  if(i === ultimoIdx[nivel]){
    i = (i + 1 + Math.floor(Math.random()*(arr.length-1))) % arr.length;
  }
  ultimoIdx[nivel] = i;
  return arr[i];
}
function limparAlerta(){
  if(alertaEl){ alertaEl.className = 'alerta'; alertaEl.textContent = ''; }
  placar.classList.remove('quente','urgente');
  alertaAtual = {nivel:-1, ts:0};
}
function avaliarAlerta(){
  if(!alertaEl) return null;
  if(S.pausado) return null;
  if(!cartelas.length || !S.sorteados.length){ limparAlerta(); return null; }

  const set = new Set(S.sorteados.map(x=>x.n));
  let min = 99;
  let codigos = [];
  let numsTodos = [];
  let nomeMin = '';

  cartelas.forEach(c=>{
    const r = analisar(c.nums, set, S.padrao);
    const q = r.faltam;
    if(q < min){
      min = q;
      codigos = [c.codigo];
      numsTodos = r.nums.slice();
      nomeMin = (c.nome || '').trim();
    }else if(q === min && min < 99){
      codigos.push(c.codigo);
      r.nums.forEach(n=>{ if(!numsTodos.includes(n)) numsTodos.push(n); });
    }
  });

  if(min > 2){ limparAlerta(); return null; }

  const agora = Date.now();
  if(alertaAtual.nivel === 1 && min > 1 && (agora - alertaAtual.ts) < 2600) return null;

  const varias = codigos.length > 1;
  const codPrincipal = codigos[0];

  /* ---------- BINGO: mostra SEMPRE o código ou o nome ---------- */
  if(min === 0){
    const fr = escolhe(AL0, 0);
    placar.classList.remove('quente'); placar.classList.add('urgente');
    alertaEl.className = 'alerta show n0';
    let extra;
    if(nomeMin) extra = ' — ' + nomeMin + ' · ' + codPrincipal;
    else if(varias) extra = ' — ' + codigos.length + ' cartelas!';
    else extra = ' — Cartela ' + codPrincipal;
    alertaEl.textContent = fr.t + extra;
    chamada(0);
    alertaAtual = {nivel:0, ts:agora};
    return {nivel:0, fala: nomeMin
      ? 'Bingo! ' + nomeMin + ' bateu bingo!'
      : 'Bingo! Temos um campeão!'};
  }

  /* ---------- FALTA 1: mostra TODAS as pedras possíveis ---------- */
  if(min === 1){
    const fr = escolhe(AL1, 1);
    placar.classList.remove('quente'); placar.classList.add('urgente');
    alertaEl.className = 'alerta show n1';

    let quem;
    if(nomeMin) quem = nomeMin;
    else if(varias) quem = codigos.length + ' cartelas';
    else quem = 'Cartela ' + codPrincipal;

    alertaEl.textContent = fr.t + ' (' + quem + ' — falta ' +
      listaFalta(numsTodos, 4) + ')';
    chamada(1);
    alertaAtual = {nivel:1, ts:agora};
    return {nivel:1, fala: nomeMin
      ? 'Atenção! O ' + nomeMin + ' está a uma pedra do bingo!'
      : fr.f};
  }

  /* ---------- FALTA 2 ---------- */
  const fr = escolhe(AL2, 2);
  placar.classList.remove('urgente'); placar.classList.add('quente');
  alertaEl.className = 'alerta show n2';

  let quem2;
  if(nomeMin) quem2 = nomeMin + ' está perto';
  else if(varias) quem2 = codigos.length + ' cartelas';
  else quem2 = 'Cartela ' + codPrincipal;
  alertaEl.textContent = fr.t + ' (' + quem2 + ')';
  alertaAtual = {nivel:2, ts:agora};
  return {nivel:2, fala: nomeMin
    ? 'Fica de olho! O ' + nomeMin + ' está a duas pedras do bingo!' : fr.f};
}

  const html = `
    <p style="font-size:14px;color:#fff;font-weight:700">
      Jogo pausado. Digite o código da cartela de quem gritou BINGO.</p>
    <div style="margin-top:14px">
      <label for="codBingo">Código da cartela</label>
      <input type="text" id="codBingo" placeholder="Ex: 027" maxlength="4"
             inputmode="numeric" autocomplete="off">
    </div>
    <p class="aviso">Padrão em uso: <b>${NOME_PADRAO[S.padrao]}</b>
      · ${S.sorteados.length} números sorteados
      · centro conta como marcado</p>
    <div class="resultado" id="resBingo"></div>
    <div id="miniBingo"></div>
  `;
  abrirModal('BINGO! — Jogo pausado', html, [
    {rotulo:'Continuar o jogo', acao:retomarJogo},
    {rotulo:'Conferir cartela', acao:validarBingo}
  ], true);
  const el = document.getElementById('codBingo');
  if(el) setTimeout(()=>el.focus(), 120);
}

function validarBingo(){
  const campo = document.getElementById('codBingo');
  const res = document.getElementById('resBingo');
  const mini = document.getElementById('miniBingo');
  if(!campo || !res) return;

  const cod = (campo.value||'').trim().padStart(3,'0');
  const c = cartelas.find(x => x.codigo === cod);
  if(!c){
    res.className = 'resultado err';
    res.innerHTML = 'CARTELA NÃO ENCONTRADA<small>Confira o código '+
      'impresso no canto da cartela.</small>';
    if(mini) mini.innerHTML = '';
    return;
  }
  const set = new Set(S.sorteados.map(x=>x.n));
  const r = analisar(c.nums, set, S.padrao);
  const quem = (c.nome||'').trim();

  if(r.valido){
    res.className = 'resultado ok';
    res.innerHTML = '✅ BINGO VÁLIDO<small>' +
      (quem ? '<b>' + quem + '</b> — cartela ' + c.codigo
            : 'Cartela ' + c.codigo) +
      ' completou ' + NOME_PADRAO[S.padrao] + '.</small>';

    const roda = document.getElementById('mRodape');
    if(roda && !roda.querySelector('.encerrar')){
      const el = document.createElement('button');
      el.className = 'btn encerrar';
      el.textContent = 'Encerrar rodada e premiar';
      el.style.borderColor = '#1e8e3e';
      el.style.color = '#5ddc85';
      el.onclick = ()=>{ fecharModal(); abrirNovaRodada(); };
      roda.appendChild(el);
    }
    if(S.voz && temSintese && S.vozAlerta){
      falarCurto('Bingo confirmado! ' +
        (quem ? quem + ' é o campeão!' : 'Temos um campeão!'));
    }
    somBingo();
  }else{
    res.className = 'resultado err';
    res.innerHTML = '❌ BINGO INVÁLIDO<small>Faltam: ' +
      (r.nums.length ? r.nums.join(', ') : '—') +
      '. Continue o jogo.</small>';
    if(S.voz && temSintese && S.vozAlerta){
      falarCurto('Ainda não. Faltam ' + r.nums.length +
        (r.nums.length === 1 ? ' número.' : ' números.'));
    }
  }
  if(mini) mini.innerHTML = minicartelaHtml(c.nums, set);
}

btnBingo.onclick = ()=>{
  if(S.pausado) abrirTelaBingo();
  else pausarNoBingo();

/* ---------- MAIS PERTO ---------- */
function abrirQuentes(){
  if(!cartelas.length){
    abrirModal('Cartelas mais próximas',
      '<p>Nenhuma cartela gerada ainda.</p><p class="aviso">Gere as '+
      'cartelas primeiro.</p>', []);
    return;
  }
  if(!S.sorteados.length){
    abrirModal('Cartelas mais próximas',
      '<p>Nenhum número sorteado ainda.</p>', []);
    return;
  }
  const set = new Set(S.sorteados.map(x=>x.n));
  const lista = cartelas.map(c=>{
    const r = analisar(c.nums, set, S.padrao);
    return {codigo:c.codigo, nome:(c.nome||'').trim(),
            faltam:r.faltam, nums:r.nums};
  }).sort((a,b)=> a.faltam - b.faltam).slice(0, 15);

  let html = '<p>Padrão: <b>'+NOME_PADRAO[S.padrao]+'</b> · '+
    S.sorteados.length+' sorteados · '+cartelas.length+' cartelas</p>'+
    '<table class="quentes"><thead><tr><th>Cartela</th><th>Nome</th>'+
    '<th>Falta</th></tr></thead><tbody>';
  lista.forEach(x=>{
    const cls = x.faltam <= 1 ? 'q1' : x.faltam === 2 ? 'q2' : '';
    const txt = x.faltam === 0 ? 'BINGO'
              : x.faltam === 1 ? 'falta 1' : 'faltam ' + x.faltam;
    const nums = (x.faltam > 0 && x.nums.length) ? x.nums.join(', ') : '';
    html += '<tr><td>'+x.codigo+'</td>'+
            '<td class="nm">'+(x.nome || '<span style="color:#4a5f88">—</span>')+'</td>'+
            '<td class="n">'+nums+'</td>'+
            '<td class="f '+cls+'">'+txt+'</td></tr>';
  });
  html += '</tbody></table>';
  if(cartelas.length > 15){
    html += '<p class="aviso">Mostrando as 15 mais próximas de '+
      cartelas.length+'.</p>';
  }
  abrirModal('Cartelas mais próximas', html, []);
}

/* ---------- SORTEIO ---------- */
function novaFila(){
  const arr = Array.from({length:75}, (_,i)=>i+1);
  for(let i=arr.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}
function piscar(){
  return new Promise(resolve=>{
    const restantes = S.fila.slice();
    const passos = 20;
    let k = 0, anterior = null;
    (function tick(){
      if(anterior !== null) setEstado(anterior,'apagado');
      if(k >= passos || !restantes.length){ resolve(); return; }
      const n = restantes[Math.floor(Math.random()*restantes.length)];
      setEstado(n,'piscando');
      anterior = n;
      tique(k/passos);
      const espera = 75 + Math.pow(k/passos, 2.3) * 300;
      k++;
      setTimeout(tick, espera);
    })();
  });
}

async function sortear(){
  if(rodando) return;
  if(S.pausado){ abrirTelaBingo(); return; }

  if(S.travaFala && falando){
    if(!pendente){ pendente = true; atualizarTravaUI(); }
    return;
  }

  if(!S.fila.length){
    abrirModal('Sorteio encerrado',
      '<p>Todos os 75 números já foram sorteados.</p>'+
      '<p class="aviso">Clique em Nova Rodada.</p>', []);
    return;
  }

  rodando = true;
  atualizarTravaUI();

  const anterior = S.atual;
  balanco();
  await piscar();
  if(anterior !== null) setEstado(anterior,'marcado');

  const n = S.fila.shift();
  S.sorteados.push({n, letra:letraDe(n), hora:new Date().toISOString()});
  S.atual = n;

  setEstado(n,'atual');
  pintar(true);
  revelacao();

  const al = avaliarAlerta();
  narrarNumero(n, al);

  salvar();
  rodando = false;
  atualizarTravaUI();
}

/* ---------- PERSISTÊNCIA ---------- */
let memoriaFallback = {};
function salvar(){
  const dados = {fila:S.fila, sorteados:S.sorteados, atual:S.atual,
                 som:S.som, voz:S.voz, vozAlerta:S.vozAlerta,
                 modoPassador:S.modoPassador, travaFala:S.travaFala,
                 pausado:S.pausado, padrao:S.padrao,
                 velocidade:S.velocidade, vozNome:S.vozNome};
  try{ localStorage.setItem(KEY_S, JSON.stringify(dados)); }
  catch(e){ memoriaFallback[KEY_S] = dados; }
  try{ localStorage.setItem(KEY_C, JSON.stringify({cartelas, proximoCodigo})); }
  catch(e){}
}
function restaurar(){
  let dados = null;
  try{ dados = JSON.parse(localStorage.getItem(KEY_S)); }
  catch(e){ dados = memoriaFallback[KEY_S] || null; }
  if(!dados || !Array.isArray(dados.fila)) return false;
  S.fila = dados.fila; S.sorteados = dados.sorteados || [];
  S.atual = dados.atual ?? null;
  S.som = dados.som !== false; S.voz = !!dados.voz;
  S.vozAlerta = dados.vozAlerta !== false;
  S.modoPassador = dados.modoPassador === true;
  S.travaFala = dados.travaFala !== false;
  S.pausado = dados.pausado === true;
  S.padrao = dados.padrao || 'cantos';
  S.velocidade = dados.velocidade || 0.8;
  S.vozNome = dados.vozNome || '';
  const jaSaiu = new Set(S.sorteados.map(x=>x.n));
  S.fila = S.fila.filter(n => !jaSaiu.has(n));
  try{
    const c = JSON.parse(localStorage.getItem(KEY_C));
    if(c){ cartelas = c.cartelas || []; proximoCodigo = c.proximoCodigo || 0; }
  }catch(e){}
  return true;
}

      codigo:c.codigo, nome:c.nome || '', nums:c.nums
    })),

  };

  document.body.removeChild(a);

  abrirModal('Backup salvo',
    '<p>Arquivo gerado com <b>'+S.sorteados.length+' números sorteados</b> '+
    'e <b>'+cartelas.length+' cartelas</b>.</p>'+

    'computador for usado no evento, basta importar este arquivo lá — '+

const inpBackup = document.getElementById('inpBackup');
inpBackup.addEventListener('change', ev=>{
  const file = ev.target.files && ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const p = JSON.parse(reader.result);
      if(!p || !p.estado || !Array.isArray(p.estado.fila)){
        throw new Error('formato');
      }
      const total = (p.estado.sorteados||[]).length;
      const qtd = (p.cartelas||[]).length;

      abrirModal('Confirmar importação',
        '<p>Arquivo: <b>'+file.name+'</b></p>'+

        '<p class="aviso">Isso <b>substitui</b> o estado atual. '+
        'Confirma?</p>',

          {rotulo:'Sim, importar', acao:()=>{ aplicarBackup(p); fecharModal(); }}

        '<p>Este arquivo não é um backup do Bingo do CEMTEC, ou está '+
        'corrompido.</p>', []);
    }
    inpBackup.value = '';
  };
  reader.readAsText(file, 'utf-8');
});

function aplicarBackup(p){
  const e = p.estado || {};
  S.fila = Array.isArray(e.fila) ? e.fila.slice() : novaFila();
  S.sorteados = Array.isArray(e.sorteados) ? e.sorteados.slice() : [];
  S.atual = (typeof e.atual === 'number') ? e.atual : null;
  S.padrao = e.padrao || 'cantos';
  S.som = e.som !== false;
  S.voz = !!e.voz;
  S.vozAlerta = e.vozAlerta !== false;
  S.travaFala = e.travaFala !== false;
  S.modoPassador = false;
  S.pausado = false;
  S.velocidade = e.velocidade || 0.8;
  S.vozNome = e.vozNome || '';

  cartelas = (p.cartelas || []).map(c=>({
    codigo: c.codigo, nome: c.nome || '', nums: c.nums
  }));
  proximoCodigo = p.proximoCodigo || cartelas.length;

  const jaSaiu = new Set(S.sorteados.map(x=>x.n));
  S.fila = S.fila.filter(n => !jaSaiu.has(n));

  salvar();
  montarPlacar();
  pintar(S.atual !== null);
  btnSom.classList.toggle('on', S.som);
  btnVoz.classList.toggle('on', S.voz);
  pintarBtnAlerta();
  pintarBtnPassador();
  pintarBtnTrava();
  btnBingo.classList.remove('ativo');
  placar.classList.remove('parado');
  selPadrao.value = S.padrao;
  selVeloc.value = String(S.velocidade);
  atualizarTravaUI();
  inicializarVozes();
  setTimeout(()=>{ ajustarTamanho(); avaliarAlerta(); }, 80);
}

/* ---------- CARTELAS ---------- */
const CASA_CENTRAL = 'CEMTEC';

function gerarCartela(assinaturas){
  for(let tent=0; tent<400; tent++){
    const nums = new Array(25).fill(null);
    for(let col=0; col<5; col++){
      const base = col*15;
      const pool = Array.from({length:15}, (_,i)=>base+i+1);
      for(let i=pool.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        [pool[i],pool[j]] = [pool[j],pool[i]];
      }
      for(let lin=0; lin<5; lin++){
        if(col===2 && lin===2) continue;
        nums[lin*5+col] = pool[lin];
      }
    }
    const sig = nums.filter(v=>v!==null).sort((a,b)=>a-b).join('-');
    if(!assinaturas.has(sig)){ assinaturas.add(sig); return nums; }
  }
  return null;
}
function abrirCartelas(){
  const comNome = cartelas.filter(c=>(c.nome||'').trim()).length;
  const html = `
    <p>Cartelas em <b>4 por folha A4</b>, com código único,
    <b>logo no centro</b>, <b>linha de nome</b> e corte tracejado.</p>
    <div style="margin-top:16px">
      <label for="qtdCart">Quantidade de cartelas</label>
      <input type="number" id="qtdCart" value="40" min="1" max="500">
    </div>
    <p class="aviso" id="infoCart"></p>
    <p class="aviso">${comNome > 0
      ? '✔ ' + comNome + ' cartelas já têm nome. Elas são impressas com o nome.'
      : 'Depois de gerar, use o botão <b>Nomes</b> para identificar quem '+
        'recebeu cada cartela.'}</p>
    <div class="resultado" id="resCart"></div>
  `;
  const botoes = [
    {rotulo:'Fechar', acao:fecharModal},
    {rotulo:'Imprimir', acao:()=>{
      if(!cartelas.length){
        const r = document.getElementById('resCart');
        if(r){ r.className='resultado err';
               r.textContent='Gere as cartelas antes de imprimir.'; }
        return;
      }
      imprimirCartelas();
    }},
    {rotulo:'Gerar cartelas', acao:gerarCartelasAcao}
  ];
  if(cartelas.length){
    botoes.splice(1, 0, {rotulo:'Limpar cartelas', acao:abrirLimparCartelas});
  }
  abrirModal('Gerar cartelas', html, botoes);
  atualizarInfoCart();
}
function atualizarInfoCart(){
  const info = document.getElementById('infoCart');
  if(!info) return;
  info.textContent = 'Última cartela gerada: ' +
    (proximoCodigo>0 ? String(proximoCodigo).padStart(3,'0') : 'nenhuma') +
    ' · Total no sistema: ' + cartelas.length;
}
function gerarCartelasAcao(){
  const campo = document.getElementById('qtdCart');
  const qtd = Math.max(1, Math.min(500, parseInt(campo.value,10) || 0));
  const assinaturas = new Set(cartelas.map(c =>
    c.nums.filter(v=>v!==null).slice().sort((a,b)=>a-b).join('-')));
  let feitas = 0;
  const primeiro = proximoCodigo + 1;
  for(let i=0; i<qtd; i++){
    const nums = gerarCartela(assinaturas);
    if(!nums) break;
    proximoCodigo++;
    cartelas.push({codigo:String(proximoCodigo).padStart(3,'0'),
                   nome:'', nums});
    feitas++;
  }
  salvar(); atualizarInfoCart(); avaliarAlerta();
  const r = document.getElementById('resCart');
  if(r){
    r.className = 'resultado ok';
    r.innerHTML = feitas + ' cartelas geradas. ' +
      Math.ceil(feitas/4) + ' folha(s) A4.' +
      '<small>Códigos ' + String(primeiro).padStart(3,'0') +
      ' a ' + String(proximoCodigo).padStart(3,'0') + '</small>';
  }
}

function cartelaHtml(c){
  const nome = (c.nome||'').trim();
  let html = '<div class="cp"><div class="topo">'+marcaCartela()+
             '<i>Nº '+c.codigo+'</i></div>'+
             '<div class="dono">'+(nome ? nome : 'Nome:')+'</div>'+
             '<table><thead><tr>';
  'BINGO'.split('').forEach(l => html += '<th>'+l+'</th>');
  html += '</tr></thead><tbody>';
  for(let lin=0; lin<5; lin++){
    html += '<tr>';
    for(let col=0; col<5; col++){

      html += (v===null)

function estáFullscreen(){
  return !!(document.fullscreenElement ||
            document.webkitFullscreenElement ||
            document.msFullscreenElement);
}
async function alternarFullscreen(){
  try{
    if(!estáFullscreen()){
      const el = document.documentElement;
      const req = el.requestFullscreen || el.webkitRequestFullscreen ||
                  el.msRequestFullscreen;
      if(!req){
        abrirModal('Tela cheia indisponível',
          '<p>Este navegador não permite tela cheia por botão.</p>'+
          '<p class="aviso">Use F11 no teclado.</p>', []);
        return;
      }
      await req.call(el);
    }else{
      const exit = document.exitFullscreen || document.webkitExitFullscreen ||
                   document.msExitFullscreen;
      if(exit) await exit.call(document);
    }
  }catch(e){
    abrirModal('Tela cheia indisponível',
      '<p>O navegador não autorizou.</p>', []);
  }
}

      '<path d="M16 3h3a2 2 0 0 1 2 2v3"></path>'+
      '<path d="M8 21H5a2 2 0 0 1-2-2v-3"></path>'+
      '<path d="M16 21h3a2 2 0 0 0 2-2v-3"></path>';

const btnAlerta = document.getElementById('btnAlerta');
function pintarBtnAlerta(){
  btnAlerta.classList.toggle('alertaOn', S.vozAlerta);
  btnAlerta.title = 'Narração dos alertas: ' +
    (S.vozAlerta ? 'LIGADA' : 'DESLIGADA');
}
btnAlerta.onclick = ()=>{
  S.vozAlerta = !S.vozAlerta;
  pintarBtnAlerta(); salvar();
  if(S.vozAlerta && temSintese){
    ac(); inicializarVozes();
    falarCurto('Alertas com narração ativados.');
  }
};

const selPadrao = document.getElementById('selPadrao');
selPadrao.onchange = ()=>{ S.padrao = selPadrao.value; salvar(); avaliarAlerta(); };

const selVeloc = document.getElementById('selVeloc');
selVeloc.onchange = ()=>{ S.velocidade = parseFloat(selVeloc.value) || 0.8; salvar(); };

const selVoz = document.getElementById('selVoz');
selVoz.onchange = ()=>{
  const vozes = listarVozesPtBR();
  const v = vozes[selVoz.selectedIndex];
  if(!v) return;
  vozEscolhida = v; S.vozNome = v.name; salvar();
  if(S.voz) falarCurto('Esta é a voz selecionada.');
};

const TECLAS_SORTEIO = ['Space','PageDown','ArrowRight','Enter','NumpadEnter'];

document.addEventListener('keydown', e=>{
  if(S.modoPassador){
    if(e.ctrlKey && e.shiftKey && (e.key === 'L' || e.key === 'l')){
      e.preventDefault(); desativarPassador(); return;
    }
    if(e.code === 'KeyB'){
      e.preventDefault();
      if(!e.repeat) btnBingo.click();
      return;
    }
    if(TECLAS_SORTEIO.includes(e.code)){
      e.preventDefault();
      if(!e.repeat) sortear();
      return;
    }
    e.preventDefault();
    e.stopPropagation();
    return;
  }

  const aberto = overlay.classList.contains('show');
  if(e.key === 'Escape'){ if(aberto) fecharModal(); return; }
  if(aberto) return;
  if(e.repeat) return;

  if(TECLAS_SORTEIO.includes(e.code)){
    e.preventDefault();
    sortear();
    return;
  }
  const k = (e.key || '').toLowerCase();
  if(k === 'b') btnBingo.click();
  else if(k === 'f') alternarFullscreen();
  else if(k === 'h') abrirHistorico();
  else if(k === 'q') abrirQuentes();
  else if(k === 'n') abrirNovaRodada();
  else if(k === 'm') btnSom.click();
  else if(k === 'v') btnVoz.click();
  else if(k === 'a') btnAlerta.click();
  else if(k === 'p') btnPassador.click();
  else if(k === 't') btnTrava.click();
});

window.addEventListener('beforeunload', e=>{
  if(S.sorteados.length > 0 && !S.modoPassador){
    e.preventDefault();
    e.returnValue = '';
  }
});

/* ---------- INIT ---------- */
(function init(){
  restaurar();
  montarPlacar();
  pintar(S.atual !== null);
  btnSom.classList.toggle('on', S.som);
  btnVoz.classList.toggle('on', S.voz);
  pintarBtnAlerta();
  pintarBtnPassador();
  pintarBtnTrava();
  selPadrao.value = S.padrao;
  selVeloc.value = String(S.velocidade);
  if(!S.fila || !S.fila.length){
    if(!S.sorteados.length){ S.fila = novaFila(); salvar(); }
  }
  inicializarVozes();
  atualizarIconeFull();
  atualizarTravaUI();
  if(S.pausado){
    btnBingo.classList.add('ativo');
    placar.classList.add('parado');
    contadorEl.className = 'pill bingo';
  }
  if(!temSintese){
    btnVoz.disabled = true; btnVoz.style.opacity = '.35';
    btnAlerta.disabled = true; btnAlerta.style.opacity = '.35';
    selVoz.disabled = true;
  }
  setTimeout(()=>{ ajustarTamanho(); avaliarAlerta(); }, 60);
  setTimeout(ajustarTamanho, 350);
  setTimeout(ajustarTamanho, 900);
})();
</script>

<script>
(function () {
  'use strict';

  var CHAVE = 'cemtec_links_cartelas_v1';
  var cartelas = [];
  try { cartelas = JSON.parse(localStorage.getItem(CHAVE) || '[]') || []; } catch (e) { cartelas = []; }

  function persistir() {
    try { localStorage.setItem(CHAVE, JSON.stringify(cartelas)); } catch (e) {}
  }

  function baseUrl() { return location.href.split('#')[0]; }

  function gerarCartela() {
    var faixas = [[1, 15], [16, 30], [31, 45], [46, 60], [61, 75]];
    var g = [[], [], [], [], []];
    for (var c = 0; c < 5; c++) {
      var pool = [];
      for (var n = faixas[c][0]; n <= faixas[c][1]; n++) pool.push(n);
      for (var r = 0; r < 5; r++) {
        var i = Math.floor(Math.random() * pool.length);
        g[r][c] = pool.splice(i, 1)[0];
      }
    }
    g[2][2] = null;
    return g;
  }

  function planificar(g) {
    var out = [];
    for (var r = 0; r < 5; r++)
      for (var c = 0; c < 5; c++)
        if (!(r === 2 && c === 2)) out.push(g[r][c]);
    return out;
  }

  function linkDe(c) {
    return baseUrl() + '#c=' + encodeURIComponent(c.codigo) + '&g=' + planificar(c.grid).join('.');
  }

  function codigoDe(n) {
    var s = String(n);
    while (s.length < 3) s = '0' + s;
    return s;
  }

  function copiar(txt, btn) {
    function feito() {
      if (!btn) return;
      var antigo = btn.textContent;
      btn.textContent = 'copiado!';
      setTimeout(function () { btn.textContent = antigo; }, 1200);
    }
    function reserva() {
      var ta = document.createElement('textarea');
      ta.value = txt;
      ta.style.cssText = 'position:fixed;top:-1000px';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); feito(); }
      catch (e) { window.prompt('Copie o link:', txt); }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(feito, reserva);
    } else { reserva(); }
  }

  /* ---------- painel de links ---------- */
  function abrirPainel() {
    var ov = document.createElement('div');
    ov.className = 'cvOv';
    ov.innerHTML =
      '<div class="cvWrap">' +
        '<div class="cvTop">' +
          '<div class="cvTitle">Cartelas e links para celular</div>' +
          '<button class="cvBtn sec" id="cvFechar">Fechar</button>' +
        '</div>' +
        '<div class="cvRow">' +
          '<label>Quantidade:</label>' +
          '<input class="cvInp" id="cvQtd" type="number" min="1" max="500" value="30">' +
          '<button class="cvBtn ok" id="cvGerar">Gerar cartelas</button>' +
          '<button class="cvBtn sec" id="cvImprimir">Imprimir cartelas</button>' +
          '<button class="cvBtn" id="cvCopiarTodos">Copiar todos os links</button>' +
          '<button class="cvBtn red" id="cvLimpar">Limpar lista</button>' +
        '</div>' +
        '<div id="cvLista"></div>' +
      '</div>';
    document.body.appendChild(ov);

    var lista = ov.querySelector('#cvLista');

    function desenhar() {
      lista.innerHTML = '';
      if (!cartelas.length) {
        lista.innerHTML = '<p style="color:#7f9ac0">Nenhuma cartela gerada ainda.</p>';
        return;
      }
      cartelas.forEach(function (c, idx) {
        var item = document.createElement('div');
        item.className = 'cvItem';

        var cod = document.createElement('div');
        cod.className = 'cvCode';
        cod.textContent = c.codigo;

        var mini = document.createElement('table');
        mini.className = 'cvMini';
        for (var r = 0; r < 5; r++) {
          var tr = document.createElement('tr');
          for (var k = 0; k < 5; k++) {
            var td = document.createElement('td');
            if (r === 2 && k === 2) { td.textContent = '★'; td.className = 'f'; }
            else td.textContent = c.grid[r][k];
            tr.appendChild(td);
          }
          mini.appendChild(tr);
        }

        var lnk = document.createElement('div');
        lnk.className = 'cvLnk';
        lnk.textContent = linkDe(c);

        var b1 = document.createElement('button');
        b1.className = 'cvBtn';
        b1.textContent = 'Copiar link';
        b1.onclick = function () { copiar(linkDe(c), b1); };

        var b2 = document.createElement('button');
        b2.className = 'cvBtn sec';
        b2.textContent = 'Abrir teste';
        b2.onclick = function () { window.open(linkDe(c), '_blank'); };

        item.appendChild(cod);
        item.appendChild(mini);
        item.appendChild(lnk);
        item.appendChild(b1);
        item.appendChild(b2);
        lista.appendChild(item);
      });
    }

    ov.querySelector('#cvFechar').onclick = function () { ov.remove(); };

    ov.querySelector('#cvGerar').onclick = function () {
      var q = parseInt(ov.querySelector('#cvQtd').value, 10);
      if (!q || q < 1) return;
      if (q > 500) q = 500;
      cartelas = [];
      for (var i = 1; i <= q; i++) {
        cartelas.push({ codigo: codigoDe(i), grid: gerarCartela() });
      }
      persistir();
      desenhar();
    };

    ov.querySelector('#cvLimpar').onclick = function () {
      if (!confirm('Apagar todas as cartelas e links gerados?')) return;
      cartelas = [];
      persistir();
      desenhar();
    };

    ov.querySelector('#cvCopiarTodos').onclick = function (ev) {
      if (!cartelas.length) return;
      var txt = cartelas.map(function (c) { return c.codigo + ' - ' + linkDe(c); }).join('\n');
      copiar(txt, ev.target);
    };

    ov.querySelector('#cvImprimir').onclick = function () {
      if (!cartelas.length) return alert('Gere as cartelas primeiro.');
      var w = window.open('', '_blank');
      if (!w) return alert('Libere pop-ups para imprimir.');
      var h = '<html><head><meta charset="utf-8"><title>Cartelas</title><style>' +
        '@page{size:A4;margin:10mm}' +
        'body{font-family:Arial,sans-serif;margin:0}' +
        '.pg{display:grid;grid-template-columns:1fr 1fr;gap:8mm;page-break-after:always}' +
        '.pg:last-child{page-break-after:auto}' +
        '.cart{border:2px solid #111;border-radius:6px;padding:6px}' +
        '.cart h3{margin:0 0 6px;font-size:12pt;text-align:center;letter-spacing:1px}' +
        '.cart table{width:100%;border-collapse:collapse}' +
        '.cart td{border:1px solid #333;text-align:center;font-size:15pt;font-weight:700;padding:6px 0}' +
        '.cart .f{background:#e8e8e8;font-size:10pt}' +
        '</style></head><body>';
      for (var i = 0; i < cartelas.length; i += 4) {
        h += '<div class="pg">';
        for (var j = i; j < i + 4 && j < cartelas.length; j++) {
          var c = cartelas[j];
          h += '<div class="cart"><h3>BINGO DO CEMTEC — ' + c.codigo + '</h3><table>';
          for (var r = 0; r < 5; r++) {
            h += '<tr>';
            for (var k = 0; k < 5; k++) {
              if (r === 2 && k === 2) h += '<td class="f">LIVRE</td>';
              else h += '<td>' + c.grid[r][k] + '</td>';
            }
            h += '</tr>';
          }
          h += '</table></div>';
        }
        h += '</div>';
      }
      h += '</body></html>';
      w.document.write(h);
      w.document.close();
      w.focus();
      setTimeout(function () { w.print(); }, 400);
    };

    desenhar();
  }

  /* ---------- modo jogador ---------- */
  function lerHash() {
    var h = location.hash.replace(/^#/, '');
    if (!h) return null;
    var partes = {};
    h.split('&').forEach(function (kv) {
      var p = kv.split('=');
      if (p[0]) partes[p[0]] = p[1];
    });
    if (!partes.g) return null;
    var nums = partes.g.split('.').map(Number);
    if (nums.length !== 24) return null;
    var grid = [[], [], [], [], []];
    var i = 0;
    for (var r = 0; r < 5; r++) {
      for (var k = 0; k < 5; k++) {
        grid[r][k] = (r === 2 && k === 2) ? null : nums[i++];
      }
    }
    return { codigo: partes.c ? decodeURIComponent(partes.c) : '', grid: grid };
  }

  function abrirJogador(c) {
    var velho = document.getElementById('cvPlay');
    if (velho) velho.remove();

    var wrap = document.createElement('div');
    wrap.id = 'cvPlay';
    wrap.className = 'cvPlay';

    var titulo = document.createElement('div');
    titulo.style.cssText = 'font-weight:800;font-size:18px;letter-spacing:1px;text-align:center';
    titulo.textContent = 'BINGO DO CEMTEC';
    wrap.appendChild(titulo);

    var sub = document.createElement('div');
    sub.style.cssText = 'color:#8fb4dc;font-size:14px';
    sub.textContent = 'Cartela ' + (c.codigo || '');
    wrap.appendChild(sub);

    var marcado = [[], [], [], [], []];
    var botoes = [];
    var tabela = document.createElement('table');
    tabela.className = 'cvGrid';
    for (var r = 0; r < 5; r++) {
      var tr = document.createElement('tr');
      for (var k = 0; k < 5; k++) {
        var td = document.createElement('td');
        var b = document.createElement('button');
        if (r === 2 && k === 2) {
          b.textContent = 'LIVRE';
          b.className = 'centro';
          b.disabled = true;
          marcado[r][k] = true;
        } else {
          b.textContent = c.grid[r][k];
          marcado[r][k] = false;
          (function (rr, kk, botao) {
            botao.onclick = function () {
              marcado[rr][kk] = !marcado[rr][kk];
              botao.classList.toggle('mk', marcado[rr][kk]);
            };
          })(r, k, b);
        }
        botoes.push(b);
        td.appendChild(b);
        tr.appendChild(td);
      }
      tabela.appendChild(tr);
    }
    wrap.appendChild(tabela);

    var painel = document.createElement('div');
    painel.style.cssText = 'color:#9fc2e6;font-size:14px;text-align:center;min-height:22px';
    wrap.appendChild(painel);

    function temBingo() {
      var i, j, ok;
      for (i = 0; i < 5; i++) { ok = true; for (j = 0; j < 5; j++) if (!marcado[i][j]) ok = false; if (ok) return 'linha ' + (i + 1); }
      for (j = 0; j < 5; j++) { ok = true; for (i = 0; i < 5; i++) if (!marcado[i][j]) ok = false; if (ok) return 'coluna ' + (j + 1); }
      ok = true; for (i = 0; i < 5; i++) if (!marcado[i][i]) ok = false; if (ok) return 'diagonal principal';
      ok = true; for (i = 0; i < 5; i++) if (!marcado[i][4 - i]) ok = false; if (ok) return 'diagonal secundária';
      return null;
    }

    var bBingo = document.createElement('button');
    bBingo.className = 'cvBtn ok';
    bBingo.style.cssText = 'padding:16px 34px;font-size:17px';
    bBingo.textContent = 'BINGO!';
    bBingo.onclick = function () {
      var res = temBingo();
      if (res) {
        painel.innerHTML = '<strong style="color:#4ade80">BINGO CONFIRMADO — ' + res + '</strong>';
      } else {
        var faltam = 0;
        for (var i = 0; i < 5; i++) for (var j = 0; j < 5; j++) if (!marcado[i][j]) faltam++;
        painel.innerHTML = '<span style="color:#fbbf24">Ainda não. Faltam ' + faltam + ' números.</span>';
      }
    };
    wrap.appendChild(bBingo);

    var bSair = document.createElement('button');
    bSair.className = 'cvBtn sec';
    bSair.textContent = 'Ir para o painel do sorteio';
    bSair.onclick = function () {
      location.hash = '';
      location.reload();
    };
    wrap.appendChild(bSair);

    document.body.appendChild(wrap);
  }

  /* ---------- inicialização ---------- */
  function iniciar() {
    var c = lerHash();
    if (c) { abrirJogador(c); return; }
    var velho = document.getElementById('cvPlay');
    if (velho) velho.remove();

    if (!document.getElementById('cvFab')) {
      var fab = document.createElement('button');
      fab.id = 'cvFab';
      fab.textContent = '🔗 LINKS';
      fab.onclick = abrirPainel;
      document.body.appendChild(fab);
    }
  }

  window.addEventListener('hashchange', iniciar);
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', iniciar);
  } else {
    iniciar();
  }
})();
</script>
