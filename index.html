<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BINGO DO CEMTEC</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0a1024; --card:#121e3d; --line:#22314f;
    --azul:#4f9bff; --txt:#eaf0ff; --dim:#8fa2c7;
    --marinho:#0B2F6B; --ciano:#1BA7EC;
    --cel:44px; --bola:180px;
  }
  html,body{height:100%;overflow:hidden}
  body{
    display:grid;grid-template-rows:auto minmax(0,1fr) auto;
    gap:8px;padding:10px 12px;
    background:radial-gradient(ellipse at 50% 0%, #14224a 0%, var(--bg) 62%);
    color:var(--txt);font-family:system-ui,'Segoe UI',Roboto,sans-serif;
  }
  body:fullscreen{padding:12px 15px}

  /* ============ CABEÇALHO ============ */
  header{display:flex;align-items:center;gap:8px;min-height:50px;flex-wrap:wrap}
  .brand{
    background:#fff;border-radius:11px;padding:4px 10px;
    display:flex;align-items:center;justify-content:center;
    flex:0 0 auto;box-shadow:0 3px 16px rgba(0,0,0,.42);
  }
  .brand img{
    display:block;height:clamp(26px,3.1vh,38px);width:auto;
    max-width:min(210px,23vw);object-fit:contain;
  }
  @media(max-width:900px){ .brand img{max-width:125px} }
  .titulo{
    font-size:clamp(12px,1.5vw,23px);font-weight:900;
    letter-spacing:.055em;color:#fff;white-space:nowrap;
    line-height:1;flex:0 0 auto;
  }
  .titulo span{color:var(--ciano)}
  @media(max-width:840px){ .titulo{display:none} }
  .spacer{flex:1;min-width:6px}
  .pill{
    border:1px solid var(--azul);border-radius:999px;
    padding:5px 13px;font-size:clamp(10px,.9vw,13px);
    font-weight:700;color:var(--azul);white-space:nowrap;
  }
  .pill.bingo{
    border-color:#ff5b5b;color:#ff8585;background:rgba(198,40,40,.18);
    animation:piscaPill 1s ease-in-out infinite;
  }
  @keyframes piscaPill{
    50%{opacity:.55}
  }
  .icobtn{
    width:39px;height:39px;border:1px solid var(--line);border-radius:11px;
    background:var(--card);color:var(--dim);cursor:pointer;
    display:grid;place-items:center;transition:.15s;flex:0 0 auto;
  }
  .icobtn:hover{color:var(--txt);border-color:#3a5480}
  .icobtn.on{
    color:var(--azul);border-color:var(--azul);background:#132a52;
    box-shadow:0 0 14px rgba(79,155,255,.28);
  }
  .icobtn.alertaOn{
    color:#ffd84d;border-color:#ffd84d;background:#3a2f0d;
    box-shadow:0 0 14px rgba(255,216,77,.35);
  }
  .icobtn.passadorOn{
    color:#37d67a;border-color:#37d67a;background:#0f2e1c;
    box-shadow:0 0 16px rgba(55,214,122,.45);
  }
  .icobtn.travaOn{
    color:#b57bff;border-color:#b57bff;background:#2a1a4a;
    box-shadow:0 0 16px rgba(181,123,255,.42);
  }
  .icobtn svg{
    width:18px;height:18px;fill:none;stroke:currentColor;
    stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
  }
  #selVoz{
    height:37px;max-width:170px;background:var(--card);
    border:1px solid var(--line);color:#cdd9f0;border-radius:10px;
    font-size:10px;font-weight:600;padding:0 4px;font-family:inherit;
  }
  #selVeloc{
    height:37px;max-width:92px;background:var(--card);
    border:1px solid var(--line);color:#cdd9f0;border-radius:10px;
    font-size:10px;font-weight:600;padding:0 4px;font-family:inherit;
  }

  /* ============ ÁREA PRINCIPAL ============ */
  main{
    display:grid;grid-template-columns:minmax(0,2.35fr) minmax(245px,.72fr);
    gap:10px;min-height:0;
  }
  @media(max-width:1040px){
    main{grid-template-columns:minmax(0,2.1fr) minmax(210px,.8fr)}
  }
  .placar{
    position:relative;
    background:linear-gradient(180deg,#0d1730,#0a1226);
    border:1px solid var(--line);border-radius:16px;
    padding:8px;display:flex;flex-direction:column;
    justify-content:center;min-height:0;overflow:hidden;
    transition:box-shadow .35s, border-color .35s;
  }
  .placar.quente{
    border-color:rgba(232,113,10,.65);
    box-shadow:0 0 0 1px rgba(232,113,10,.45),
               0 0 34px rgba(232,113,10,.22) inset;
  }
  .placar.urgente{
    border-color:rgba(255,216,77,.85);
    box-shadow:0 0 0 2px rgba(255,216,77,.55),
               0 0 46px rgba(255,216,77,.30) inset;
    animation:bordaPulsa 1.15s ease-in-out infinite;
  }
  .placar.parado{
    border-color:rgba(255,91,91,.9);
    box-shadow:0 0 0 3px rgba(255,91,91,.7),
               0 0 60px rgba(255,91,91,.35) inset;
    animation:bordaPulsaBingo 1s ease-in-out infinite;
  }
  @keyframes bordaPulsa{
    0%,100%{
      box-shadow:0 0 0 2px rgba(255,216,77,.45),
                 0 0 26px rgba(255,216,77,.16) inset;
    }
    50%{
      box-shadow:0 0 0 3px rgba(255,216,77,.9),
                 0 0 58px rgba(255,216,77,.42) inset;
    }
  }
  @keyframes bordaPulsaBingo{
    0%,100%{
      box-shadow:0 0 0 3px rgba(255,91,91,.5),
                 0 0 34px rgba(255,91,91,.2) inset;
    }
    50%{
      box-shadow:0 0 0 4px rgba(255,91,91,1),
                 0 0 70px rgba(255,91,91,.5) inset;
    }
  }

  /* ============ GRADE DE BOLAS ============ */
  .grade{
    display:flex;flex-direction:column;gap:5px;
    align-items:center;justify-content:center;flex:1;min-height:0;
    padding-top:20px;
  }
  .linha{display:flex;align-items:center;gap:5px;justify-content:center}
  .letra{
    width:calc(var(--cel)*.86);height:calc(var(--cel)*.86);flex:0 0 auto;
    border-radius:10px;background:linear-gradient(160deg,#2f6fd0,#1b4a99);
    display:grid;place-items:center;font-weight:800;
    font-size:calc(var(--cel)*.46);color:#fff;
    box-shadow:0 2px 8px rgba(0,0,0,.35);
  }
  .cel{
    width:var(--cel);height:var(--cel);flex:0 0 auto;
    border-radius:50%;display:grid;place-items:center;
    font-weight:800;font-size:calc(var(--cel)*.38);
    position:relative;overflow:hidden;
    background:#1b2543;color:#3b4b70;
    transition:transform .18s, box-shadow .25s, background .25s,
               color .25s, filter .25s;
  }
  .cel.aceso{
    color:#fff;background:var(--cor);
    box-shadow:inset 0 -3px 8px rgba(0,0,0,.55),
               inset 0 3px 6px rgba(255,255,255,.24),
               0 3px 9px rgba(0,0,0,.5);
  }
  .cel .brilho{
    position:absolute;inset:0;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle at 30% 24%,
      rgba(255,255,255,.9), rgba(255,255,255,0) 46%);
  }
  .cel .n{
    position:relative;z-index:2;
    text-shadow:0 0 2px rgba(0,0,0,.85), 0 1px 3px rgba(0,0,0,.9);
  }
  .cel.aceso.listrada::before{
    content:'';position:absolute;left:-12%;right:-12%;
    top:30%;height:40%;background:#fff;z-index:1;
  }
  .cel.aceso.listrada .n{
    color:#1a1a1a;
    text-shadow:0 1px 0 rgba(255,255,255,.6);
  }
  .cel.piscando{
    color:#1a1200;background:#ffd84d;transform:scale(1.16);
    box-shadow:0 0 20px 5px rgba(255,216,77,.8);z-index:5;
  }
  .cel.piscando .n{text-shadow:none}
  .cel.marcado{
    opacity:1;filter:brightness(.96) saturate(1);
    box-shadow:inset 0 -3px 8px rgba(0,0,0,.5),
               inset 0 3px 6px rgba(255,255,255,.2),
               0 3px 9px rgba(0,0,0,.45),
               0 0 9px rgba(255,255,255,.10);
  }
  .cel.marcado .n{
    text-shadow:0 0 2px rgba(0,0,0,.9), 0 1px 3px rgba(0,0,0,.95);
  }
  .cel.atual{
    transform:scale(1.18);z-index:6;
    box-shadow:0 0 0 3px rgba(79,155,255,.95),
               0 0 28px 9px rgba(79,155,255,.6),
               inset 0 -3px 8px rgba(0,0,0,.5);
  }

  /* ============ ALERTA ============ */
  .alerta{
    position:absolute;left:50%;top:7px;
    transform:translateX(-50%) translateY(-18px) scale(.8);
    padding:9px 22px;border-radius:999px;
    font-weight:900;font-size:clamp(10px,1.08vw,16px);
    letter-spacing:.04em;white-space:nowrap;max-width:96%;
    overflow:hidden;text-overflow:ellipsis;
    opacity:0;pointer-events:none;z-index:40;
    transform-origin:center top;
  }
  .alerta.show{opacity:1}
  .alerta.n2{
    background:linear-gradient(90deg,#ff9d3d,#e8710a);color:#fff;
    box-shadow:0 8px 26px rgba(232,113,10,.55);
    animation:entraPula .48s cubic-bezier(.2,1.5,.4,1) both,
              pulsa 1.6s ease-in-out .55s infinite;
  }
  .alerta.n1{
    background:linear-gradient(90deg,#ffe27a,#ffc400);color:#241a00;
    box-shadow:0 0 32px rgba(255,216,77,.95);
    animation:entraPula .48s cubic-bezier(.2,1.5,.4,1) both,
              pulsaRapido .85s ease-in-out .5s infinite;
  }
  .alerta.n0{
    background:linear-gradient(90deg,#37d67a,#0f9d58);color:#04240f;
    box-shadow:0 0 34px rgba(55,214,122,.95);
    animation:entraPula .48s cubic-bezier(.2,1.5,.4,1) both,
              pulsaRapido .8s ease-in-out .5s infinite;
  }
  .alerta.np{
    background:linear-gradient(90deg,#3a86d4,#1b4a99);color:#fff;
    box-shadow:0 8px 26px rgba(58,134,212,.55);
    animation:entraPula .48s cubic-bezier(.2,1.5,.4,1) both;
  }
  .alerta.npk{
    background:linear-gradient(90deg,#ff5b5b,#c62828);color:#fff;
    box-shadow:0 8px 30px rgba(198,40,40,.7);
    animation:entraPula .48s cubic-bezier(.2,1.5,.4,1) both,
              pulsaRapido .9s ease-in-out .5s infinite;
  }
  @keyframes entraPula{
    0%{opacity:0;transform:translateX(-50%) translateY(-22px) scale(.75)}
    55%{opacity:1;transform:translateX(-50%) translateY(2px) scale(1.09)}
    75%{transform:translateX(-50%) translateY(0) scale(.97)}
    100%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
  }
  @keyframes pulsa{
    0%,100%{transform:translateX(-50%) scale(1)}
    50%{transform:translateX(-50%) scale(1.035)}
  }
  @keyframes pulsaRapido{
    0%,100%{transform:translateX(-50%) scale(1)}
    50%{transform:translateX(-50%) scale(1.055)}
  }
  .alerta.show::after{
    content:'';position:absolute;top:0;bottom:0;width:36%;
    left:-45%;pointer-events:none;
    background:linear-gradient(100deg,transparent,
      rgba(255,255,255,.55),transparent);
    animation:varre 2.1s ease-in-out infinite;
  }
  @keyframes varre{
    0%{left:-45%}
    55%,100%{left:115%}
  }

  /* ============ PAINEL DIREITO ============ */
  .painel{
    background:linear-gradient(180deg,#101c3a,#0b1428);
    border:1px solid var(--line);border-radius:16px;
    padding:10px 9px;display:flex;flex-direction:column;
    align-items:center;gap:6px;min-height:0;overflow:hidden;
  }
  .rotulo{
    font-size:9.5px;letter-spacing:.19em;color:var(--azul);
    font-weight:800;margin-bottom:-2px;
  }
  .selo-letra{
    width:clamp(36px,4.4vh,52px);height:clamp(36px,4.4vh,52px);
    border-radius:12px;flex:0 0 auto;
    background:linear-gradient(160deg,#2f6fd0,#1b4a99);
    display:grid;place-items:center;
    font-size:clamp(18px,2.2vh,27px);font-weight:900;color:#fff;
    box-shadow:0 3px 12px rgba(31,111,208,.5),
               inset 0 2px 5px rgba(255,255,255,.25);
    line-height:1;
  }
  .selo-letra.vazio{
    background:#1b2543;color:#3b4b70;
    box-shadow:inset 0 0 0 1px var(--line);
  }
  .bola{
    width:var(--bola);height:var(--bola);
    aspect-ratio:1/1;min-width:var(--bola);min-height:var(--bola);
    flex:0 0 auto;flex-shrink:0;border-radius:50%;
    position:relative;overflow:hidden;display:grid;place-items:center;
    background:#16223f;color:#3b4b70;
    box-shadow:inset 0 -9px 20px rgba(0,0,0,.6),
               inset 0 9px 15px rgba(255,255,255,.16),
               0 10px 28px rgba(0,0,0,.55);
    transition:.3s;
  }
  .bola.aceso{background:var(--cor);color:#fff}
  .bola .brilho{
    position:absolute;inset:0;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle at 30% 22%,
      rgba(255,255,255,.88), rgba(255,255,255,0) 44%);
  }
  .bola.aceso.listrada::before{
    content:'';position:absolute;left:-12%;right:-12%;
    top:30%;height:40%;background:#fff;z-index:1;
  }
  .bola.aceso.listrada .n{
    color:#1a1a1a;
    text-shadow:0 2px 0 rgba(255,255,255,.55);
  }
  .bola .n{
    position:relative;z-index:2;font-weight:800;line-height:1;
    font-size:calc(var(--bola)*.40);
    text-shadow:0 0 4px rgba(0,0,0,.9), 0 2px 7px rgba(0,0,0,.95);
  }
  .bola.vazia .n{
    font-size:calc(var(--bola)*.115);font-weight:600;
    color:#5a6f96;text-shadow:none;text-align:center;padding:0 14px;
    line-height:1.4;
  }
  .frase{
    font-size:clamp(10.5px,1.05vw,15.5px);line-height:1.36;text-align:center;
    color:#dbe6ff;max-width:100%;min-height:2.6em;
    display:flex;align-items:center;justify-content:center;
    padding:0 3px;
  }
  .frase.ativa{color:#fff;font-weight:600}
  .ultimos{margin-top:auto;width:100%}
  .ultimos .t{
    font-size:8.5px;letter-spacing:.15em;color:var(--dim);
    margin-bottom:5px;font-weight:700;
  }
  .ultimos .lista{display:flex;gap:5px;flex-wrap:wrap}
  .mini{
    width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
    font-size:12px;font-weight:800;color:#fff;position:relative;
    overflow:hidden;background:var(--cor);
    box-shadow:inset 0 -2px 4px rgba(0,0,0,.5);flex:0 0 auto;
  }
  .mini.listrada::before{
    content:'';position:absolute;left:-12%;right:-12%;top:31%;height:38%;
    background:#fff;z-index:1;
  }
  .mini span{position:relative;z-index:2;text-shadow:0 0 2px #000}
  .mini.listrada span{color:#1a1a1a;text-shadow:0 1px 0 rgba(255,255,255,.5)}

  /* ============ BARRA INFERIOR ============ */
  footer{
    display:flex;gap:10px;align-items:center;
    flex-wrap:wrap;justify-content:center;
  }
  button{font-family:inherit;cursor:pointer;transition:.15s;border-radius:11px}
  footer > button,
  footer > select{
    flex:0 0 104px;
    width:104px;
    height:46px;
    padding:0 4px;
    border-radius:11px;
    font-size:10px;
    font-weight:700;
    letter-spacing:.01em;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    line-height:1.1;
    box-sizing:border-box;
  }
  .btn{
    background:var(--card);border:1px solid var(--line);color:#cdd9f0;
  }
  .btn:hover{background:#17264a;border-color:#39547f;color:#fff}
  .btn:active{transform:scale(.97)}
  .btn:focus-visible,.icobtn:focus-visible{
    outline:2px solid var(--azul);outline-offset:2px;
  }
  #btnSortear{
    background:linear-gradient(180deg,#4f9bff,#2f74db);
    border:none;color:#fff;font-size:11.5px;letter-spacing:.06em;
    box-shadow:0 7px 22px rgba(79,155,255,.38);
  }
  #btnSortear:hover{background:linear-gradient(180deg,#63a8ff,#3b81e8)}
  #btnSortear:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
  #btnSortear.narrando{
    background:linear-gradient(180deg,#6a4fbf,#4b3390);
    box-shadow:0 0 0 2px rgba(181,123,255,.6);
    font-size:9px;letter-spacing:.04em;cursor:wait;
  }
  #btnSortear.narrando.agendado{
    background:linear-gradient(180deg,#8a5f2a,#6b4516);
    box-shadow:0 0 0 2px rgba(255,180,80,.7);
  }
  #btnSortear.paradoBtn{
    background:linear-gradient(180deg,#6b6b6b,#4a4a4a);
    box-shadow:none;font-size:10px;
  }
  #btnBingo{
    background:linear-gradient(180deg,#ff5b5b,#c62828);
    border:none;color:#fff;font-size:11.5px;letter-spacing:.05em;
    box-shadow:0 7px 22px rgba(198,40,40,.45);
  }
  #btnBingo:hover{background:linear-gradient(180deg,#ff7373,#d93a3a)}
  #btnBingo:active{transform:scale(.97)}
  #btnBingo.ativo{
    animation:piscaBingo .9s ease-in-out infinite;
    box-shadow:0 0 0 3px rgba(255,91,91,.85),0 7px 26px rgba(198,40,40,.6);
  }
  @keyframes piscaBingo{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.055)}
  }
  footer select{
    background:var(--card);border:1px solid var(--line);color:#cdd9f0;
    padding:0 12px 0 4px;font-size:9.5px;
  }
  footer select:focus-visible{outline:2px solid var(--azul);outline-offset:2px}

  /* ============ BOTÃO FLUTUANTE DE LINKS (original) ============ */
  #cvFab{
    position:fixed;right:16px;bottom:14px;z-index:9000;
    padding:12px 18px;border:0;border-radius:999px;
    background:#16a34a;color:#fff;
    font:700 14px system-ui,sans-serif;cursor:pointer;
    box-shadow:0 6px 18px rgba(0,0,0,.45);
  }
  #cvFab:hover{background:#128a3e}

  /* ============ MODAL ============ */
  .overlay{
    position:fixed;inset:0;background:rgba(4,8,18,.86);
    backdrop-filter:blur(6px);display:none;place-items:center;
    padding:20px;z-index:100;
  }
  .overlay.show{display:grid}
  .modal{
    background:linear-gradient(180deg,#101c3a,#0a1226);
    border:1px solid #2c4370;border-radius:16px;
    width:min(680px,100%);max-height:90vh;display:flex;flex-direction:column;
    box-shadow:0 30px 80px rgba(0,0,0,.75);
  }
  .modal.bingoM{
    border-color:#c62828;
    box-shadow:0 0 0 2px rgba(198,40,40,.5),0 30px 80px rgba(0,0,0,.8);
  }
  .modal header{padding:15px 19px;border-bottom:1px solid var(--line)}
  .modal header h3{font-size:15px;letter-spacing:.04em}
  .modal .corpo{padding:17px 19px;overflow-y:auto}
  .modal footer{
    padding:13px 19px;border-top:1px solid var(--line);
    display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;
  }
  .modal p{font-size:13px;line-height:1.58;color:#c3d0e8}
  .modal label{
    display:block;font-size:11px;letter-spacing:.11em;
    color:var(--dim);margin-bottom:6px;font-weight:700;
  }
  .modal input[type=number],
  .modal input[type=text]{
    width:100%;background:#0c1730;border:1px solid var(--line);
    border-radius:10px;padding:11px 13px;color:#fff;font-size:16px;
    font-family:inherit;font-weight:600;
  }
  .modal input:focus{outline:2px solid var(--azul);outline-offset:1px}
  .modal select{width:100%;height:46px}
  .modal .btn{
    flex:0 0 auto;width:auto;padding:0 16px;height:40px;
    background:var(--card);border:1px solid var(--line);color:#cdd9f0;
    font-size:12px;font-weight:700;
  }
  .modal .btn:hover{background:#17264a;border-color:#39547f;color:#fff}
  .aviso{font-size:11.5px;color:var(--dim);line-height:1.55;margin-top:9px}
  .aviso b{color:#cdd9f0}
  .resultado{
    margin-top:13px;padding:14px;border-radius:11px;text-align:center;
    font-weight:800;font-size:14px;letter-spacing:.06em;display:none;
  }
  .resultado.ok{
    display:block;background:rgba(30,142,62,.18);
    border:1px solid #1e8e3e;color:#5ddc85;
  }
  .resultado.err{
    display:block;background:rgba(198,40,40,.18);
    border:1px solid #c62828;color:#ff8585;
  }
  .resultado small{
    display:block;font-weight:500;font-size:11.5px;
    margin-top:7px;line-height:1.5;letter-spacing:0;opacity:.9;
  }
  table.hist{width:100%;border-collapse:collapse;font-size:12.5px}
  table.hist th{
    text-align:left;color:var(--dim);font-size:10.5px;
    letter-spacing:.1em;padding:6px 8px;border-bottom:1px solid var(--line);
  }
  table.hist td{
    padding:6px 8px;border-bottom:1px solid rgba(34,49,79,.5);
    color:#d5e0f5;
  }
  table.hist tr:last-child td{border-bottom:none}
  table.quentes{

    var o=c.createOscillator(), g=c.createGain();
    var t=c.currentTime+i*0.11;
    o.type='square'; o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(0.10,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.42);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t+0.45);
  });
}

function ehPtBR(v){

    if(tinhaPendente) setTimeout(function(){ sortear(); }, 220);

  }

var tokenFala = 0;
function falarBlocos(blocos){
  if(!temSintese || !blocos.length){ marcarFalando(false); return; }
  var meu = ++tokenFala;
  try{ speechSynthesis.cancel(); }catch(e){}
  marcarFalando(true);
  var i = 0;
  function seguir(){
    if(meu !== tokenFala) return;
    if(i >= blocos.length){
      setTimeout(function(){ if(meu === tokenFala) marcarFalando(false); }, 120);
      return;
    }
    var b = blocos[i++];
    if(b.pausa != null){ setTimeout(seguir, b.pausa); return; }
    var u = new SpeechSynthesisUtterance(b.texto);
    if(vozEscolhida){ u.voice = vozEscolhida; }
    u.lang = 'pt-BR';
    u.rate = b.rate || S.velocidade;
    u.pitch = b.pitch || 1.0;
    u.volume = b.volume || 1;
    var concluido = false;
    function avancar(){
      if(concluido) return;
      concluido = true;
      if(meu !== tokenFala) return;
      setTimeout(seguir, 150);
    }
    u.onend = avancar; u.onerror = avancar;
    try{ speechSynthesis.speak(u); }
    catch(e){ avancar(); return; }
    setTimeout(avancar, Math.max(1400, b.texto.length * 105));
  }
  setTimeout(seguir, 260);
}
function falarCurto(texto){ falarBlocos([{texto: texto}]); }

function narrarNumero(n, al){
  var temNumero = S.voz;
  var temAlerta = S.vozAlerta && al && al.fala;
  if(!temNumero && !temAlerta){ marcarFalando(false); return; }
  var blocos = [];
  if(temNumero){
    blocos.push({texto:'Letra ' + letraDe(n) + '.'});
    blocos.push({pausa:1100});
    blocos.push({texto:FRASES[n-1] + '.'});
    blocos.push({pausa:1300});
    blocos.push({texto:'Número ' + extenso(n) + '.'});
  }
  if(temAlerta){
    if(blocos.length) blocos.push({pausa:750});
    blocos.push({
      texto: al.fala,
      rate: Math.min(1.05, S.velocidade + 0.14),
      pitch: al.nivel === 1 ? 1.16 : 1.08
    });
  }
  falarBlocos(blocos);
}

/* ================= ANÁLISE DA CARTELA ================= */
var PADROES = {
  cantos: [0,4,20,24],
  x:      [0,4,6,8,12,16,18,20,24],
  borda:  [0,1,2,3,4,5,9,10,14,15,19,20,21,22,23,24],
  cheia:  []
};
for(var pi=0; pi<25; pi++) PADROES.cheia.push(pi);

var NOME_PADRAO = {
  cantos:'Quatro cantos', x:'X', borda:'Borda',
  linha:'Linha ou coluna', cheia:'Cartela cheia'
};

function analisar(nums, set, padrao){
  if(padrao === 'linha'){
    var grupos = [], l, c, v;
    for(l=0; l<5; l++){
      var gl = [];
      for(c=0; c<5; c++){
        v = nums[l*5+c];
        if(v === null) continue;
        if(!set[v]) gl.push(v);
      }
      grupos.push(gl);
    }
    for(c=0; c<5; c++){
      var gc = [];
      for(l=0; l<5; l++){
        v = nums[l*5+c];
        if(v === null) continue;
        if(!set[v]) gc.push(v);
      }
      grupos.push(gc);
    }
    var min = 99, k, j;
    for(k=0; k<grupos.length; k++){
      if(grupos[k].length < min) min = grupos[k].length;
    }
    var uniao = [];
    for(k=0; k<grupos.length; k++){
      if(grupos[k].length === min){
        for(j=0; j<grupos[k].length; j++){
          if(uniao.indexOf(grupos[k][j]) === -1) uniao.push(grupos[k][j]);
        }
      }
    }
    uniao.sort(function(a,b){ return a-b; });
    return {valido: min === 0, faltam: min, nums: uniao};
  }
  var arr = PADROES[padrao], falta = [];
  for(var q=0; q<arr.length; q++){
    var val = nums[arr[q]];
    if(val === null) continue;
    if(!set[val] && falta.indexOf(val) === -1) falta.push(val);
  }
  falta.sort(function(a,b){ return a-b; });
  return {valido: falta.length === 0, faltam: falta.length, nums: falta};
}

function listaFalta(nums, limite){
  var arr = (nums||[]).slice().sort(function(a,b){ return a-b; });
  var lim = limite || 4;
  if(!arr.length) return '';
  if(arr.length === 1) return 'o ' + arr[0];
  if(arr.length === 2) return 'o ' + arr[0] + ' ou o ' + arr[1];
  if(arr.length <= lim){
    return 'o ' + arr.slice(0,arr.length-1).join(', ') + ' ou o ' + arr[arr.length-1];
  }
  return 'o ' + arr.slice(0,lim).join(', ') + ' ou outro';
}

/* ================= ALERTAS ================= */
var ultimoIdx = {0:-1, 1:-1, 2:-1};
var alertaAtual = {nivel:-1, ts:0};

function escolhe(arr, nivel){
  if(arr.length === 1) return arr[0];
  var i = Math.floor(Math.random()*arr.length);
  if(i === ultimoIdx[nivel]){
    i = (i + 1 + Math.floor(Math.random()*(arr.length-1))) % arr.length;
  }
  ultimoIdx[nivel] = i;
  return arr[i];
}
function limparAlerta(){
  if(alertaEl){ alertaEl.className = 'alerta'; alertaEl.textContent = ''; }
  placar.classList.remove('quente','urgente');
  alertaAtual = {nivel:-1, ts:0};
}
function avaliarAlerta(){
  if(!alertaEl) return null;
  if(S.pausado) return null;
  if(!cartelas.length || !S.sorteados.length){ limparAlerta(); return null; }

  var set = {};
  for(var i=0;i<S.sorteados.length;i++) set[S.sorteados[i].n] = 1;

  var min = 99, codigos = [], numsTodos = [], nomeMin = '';

  for(var k=0; k<cartelas.length; k++){
    var c = cartelas[k];
    var r = analisar(c.nums, set, S.padrao);
    var q = r.faltam;
    if(q < min){
      min = q;
      codigos = [c.codigo];
      numsTodos = r.nums.slice();
      nomeMin = (c.nome||'').trim();
    }else if(q === min && min < 99){
      codigos.push(c.codigo);
      for(var t=0; t<r.nums.length; t++){
        if(numsTodos.indexOf(r.nums[t]) === -1) numsTodos.push(r.nums[t]);
      }
    }
  }

  if(min > 2){ limparAlerta(); return null; }

  var agora = Date.now();
  if(alertaAtual.nivel === 1 && min > 1 && (agora - alertaAtual.ts) < 2600) return null;

  var varias = codigos.length > 1;
  var codPrincipal = codigos[0];

  /* ---------- BINGO ---------- */
  if(min === 0){
    var fr = escolhe(AL0, 0);
    placar.classList.remove('quente');
    placar.classList.add('urgente');
    alertaEl.className = 'alerta show n0';
    var extra;
    if(nomeMin) extra = ' — ' + nomeMin + ' · ' + codPrincipal;
    else if(varias) extra = ' — ' + codigos.length + ' cartelas!';
    else extra = ' — Cartela ' + codPrincipal;
    alertaEl.textContent = fr.t + extra;
    chamada(0);
    alertaAtual = {nivel:0, ts:agora};
    return {
      nivel:0,
      fala: nomeMin ? ('Bingo! ' + nomeMin + ' bateu bingo!') : 'Bingo! Temos um campeão!'
    };
  }

  /* ---------- FALTA 1 ---------- */
  if(min === 1){
    var fr1 = escolhe(AL1, 1);
    placar.classList.remove('quente');
    placar.classList.add('urgente');
    alertaEl.className = 'alerta show n1';
    var quem;
    if(nomeMin) quem = nomeMin;
    else if(varias) quem = codigos.length + ' cartelas';
    else quem = 'Cartela ' + codPrincipal;
    alertaEl.textContent = fr1.t + ' (' + quem + ' — falta ' +
      listaFalta(numsTodos, 4) + ')';
    chamada(1);
    alertaAtual = {nivel:1, ts:agora};
    return {
      nivel:1,
      fala: nomeMin ? ('Atenção! O ' + nomeMin + ' está a uma pedra do bingo!') : fr1.f
    };
  }

  /* ---------- FALTA 2 ---------- */
  var fr2 = escolhe(AL2, 2);
  placar.classList.remove('urgente');
  placar.classList.add('quente');
  alertaEl.className = 'alerta show n2';
  var quem2;
  if(nomeMin) quem2 = nomeMin + ' está perto';
  else if(varias) quem2 = codigos.length + ' cartelas';
  else quem2 = 'Cartela ' + codPrincipal;
  alertaEl.textContent = fr2.t + ' (' + quem2 + ')';
  alertaAtual = {nivel:2, ts:agora};
  return {
    nivel:2,
    fala: nomeMin ? ('Fica de olho! O ' + nomeMin + ' está a duas pedras do bingo!') : fr2.f
  };
}

/* ================= SORTEIO ================= */
function novaFila(){
  var arr = [];
  for(var i=1; i<=75; i++) arr.push(i);
  for(var j=arr.length-1; j>0; j--){
    var k = Math.floor(Math.random()*(j+1));
    var tmp = arr[j]; arr[j] = arr[k]; arr[k] = tmp;
  }
  return arr;
}
function piscar(){
  return new Promise(function(resolve){
    var restantes = S.fila.slice();
    var passos = 20;
    var k = 0, anterior = null;
    function tick(){
      if(anterior !== null) setEstado(anterior,'apagado');
      if(k >= passos || !restantes.length){ resolve(); return; }
      var n = restantes[Math.floor(Math.random()*restantes.length)];
      setEstado(n,'piscando');
      anterior = n;
      tique(k/passos);
      var espera = 75 + Math.pow(k/passos, 2.3) * 300;
      k++;
      setTimeout(tick, espera);
    }
    tick();
  });
}
function sortear(){
  if(rodando) return;
  if(S.pausado){ abrirTelaBingo(); return; }
  if(S.travaFala && falando){
    if(!pendente){ pendente = true; atualizarTravaUI(); }
    return;
  }
  if(!S.fila.length){
    abrirModal('Sorteio encerrado',
      '<p>Todos os 75 números já foram sorteados.</p>' +
      '<p class="aviso">Clique em Nova Rodada.</p>', []);
    return;
  }
  rodando = true;
  atualizarTravaUI();
  var anterior = S.atual;
  balanco();
  piscar().then(function(){
    if(anterior !== null) setEstado(anterior,'marcado');
    var n = S.fila.shift();
    S.sorteados.push({n:n, letra:letraDe(n), hora:new Date().toISOString()});
    S.atual = n;
    setEstado(n,'atual');
    pintar(true);
    revelacao();
    var al = avaliarAlerta();
    narrarNumero(n, al);
    salvar();
    rodando = false;
    atualizarTravaUI();
  });
}

/* ================= PERSISTÊNCIA ================= */
var memoriaFallback = {};
function salvar(){
  var dados = {
    fila:S.fila, sorteados:S.sorteados, atual:S.atual,
    som:S.som, voz:S.voz, vozAlerta:S.vozAlerta,
    modoPassador:S.modoPassador, travaFala:S.travaFala,
    pausado:S.pausado, padrao:S.padrao,
    velocidade:S.velocidade, vozNome:S.vozNome
  };
  try{ localStorage.setItem(KEY_S, JSON.stringify(dados)); }
  catch(e){ memoriaFallback[KEY_S] = dados; }
  try{ localStorage.setItem(KEY_C, JSON.stringify({cartelas:cartelas, proximoCodigo:proximoCodigo})); }
  catch(e){ memoriaFallback[KEY_C] = {cartelas:cartelas, proximoCodigo:proximoCodigo}; }
}
function restaurar(){
  var dados = null;
  try{ dados = JSON.parse(localStorage.getItem(KEY_S)); }
  catch(e){ dados = memoriaFallback[KEY_S] || null; }
  if(!dados || !(dados.fila instanceof Array)) return false;

  S.fila = dados.fila;
  S.sorteados = dados.sorteados || [];
  S.atual = (typeof dados.atual === 'number') ? dados.atual : null;
  S.som = dados.som !== false;
  S.voz = !!dados.voz;
  S.vozAlerta = dados.vozAlerta !== false;
  S.modoPassador = dados.modoPassador === true;
  S.travaFala = dados.travaFala !== false;
  S.pausado = dados.pausado === true;
  S.padrao = dados.padrao || 'cantos';
  S.velocidade = dados.velocidade || 0.8;
  S.vozNome = dados.vozNome || '';

  var ja = {};
  for(var i=0;i<S.sorteados.length;i++) ja[S.sorteados[i].n] = 1;
  S.fila = S.fila.filter(function(n){ return !ja[n]; });

  try{
    var c = JSON.parse(localStorage.getItem(KEY_C));
    if(c){ cartelas = c.cartelas || []; proximoCodigo = c.proximoCodigo || 0; }
  }catch(e){
    if(memoriaFallback[KEY_C]){
      cartelas = memoriaFallback[KEY_C].cartelas || [];
      proximoCodigo = memoriaFallback[KEY_C].proximoCodigo || 0;
    }
  }
  return true;
}

/* ================= CARTELAS (GERADOR ÚNICO) ================= */
function gerarCartela(assinaturas){
  for(var tent=0; tent<400; tent++){
    var nums = [], col, lin;
    for(col=0; col<5; col++){
      var pool = [];
      for(var i=1; i<=15; i++) pool.push(col*15 + i);
      for(var j=pool.length-1; j>0; j--){
        var k = Math.floor(Math.random()*(j+1));
        var tmp = pool[j]; pool[j] = pool[k]; pool[k] = tmp;
      }
      for(lin=0; lin<5; lin++){
        nums[lin*5+col] = (col===2 && lin===2) ? null : pool[lin];
      }
    }
    var sig = nums.filter(function(v){ return v!==null; })
      .sort(function(a,b){ return a-b; }).join('-');
    if(!assinaturas[sig]){ assinaturas[sig] = 1; return nums; }
  }
  return null;
}
function gerarCartelasAcao(){
  var campo = document.getElementById('qtdCart');
  var qtd = Math.max(1, Math.min(500, parseInt(campo.value,10) || 0));
  var assin = {};
  for(var i=0; i<cartelas.length; i++){
    assin[cartelas[i].nums.filter(function(v){ return v!==null; })
      .sort(function(a,b){ return a-b; }).join('-')] = 1;
  }
  var feitas = 0, primeiro = proximoCodigo + 1;
  for(var k=0; k<qtd; k++){
    var nums = gerarCartela(assin);
    if(!nums) break;
    proximoCodigo++;
    cartelas.push({
      codigo: ('000' + proximoCodigo).slice(-3),
      nome: '', telefone: '', nums: nums
    });
    feitas++;
  }
  salvar();
  var r = document.getElementById('resCart');
  if(r){
    r.className = 'resultado ok';
    r.innerHTML = feitas + ' cartelas geradas. ' + Math.ceil(feitas/4) + ' folha(s) A4.' +

function linkDe(c){
  var nums = [];
  for(var i=0;i<c.nums.length;i++) if(c.nums[i] !== null) nums.push(c.nums[i]);
  return location.href.split('#')[0] +
    '#c=' + encodeURIComponent(c.codigo) + '&g=' + nums.join('.');
}
function copiar(txt, btn){
  function ok(){
    if(!btn) return;
    var a = btn.textContent;
    btn.textContent = 'copiado!';
    setTimeout(function(){ btn.textContent = a; }, 1200);
  }
  function reserva(){
    var ta = document.createElement('textarea');
    ta.value = txt; ta.style.cssText = 'position:fixed;top:-1000px';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); ok(); }
    catch(e){ window.prompt('Copie:', txt); }
    document.body.removeChild(ta);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(ok, reserva);
  }else reserva();
}

function enviarWhats(){
  var r = document.getElementById('resWh');
  var el = document.getElementById('whUrl');
  var url = ((el && el.value) || '').trim();
  if(!url){ r.className='resultado err'; r.textContent='Configure a URL do webhook primeiro.'; return; }

  var lista = [];
  for(var i=0;i<cartelas.length;i++){
    var c = cartelas[i];
    if((c.telefone||'').trim()){
      lista.push({codigo:c.codigo, nome:c.nome||'', telefone:c.telefone, link:linkDe(c)});
    }
  }
  if(!lista.length){
    r.className='resultado err';
    r.textContent='Nenhuma cartela tem telefone cadastrado.';
    return;
  }
  r.className = 'resultado ok';
  r.textContent = 'Enviando ' + lista.length + ' cartelas...';

  fetch(url, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({evento:'cartelas', cartelas:lista})
  })
  .then(function(res){ return res.text(); })
  .then(function(){ r.className='resultado ok'; r.textContent = lista.length + ' cartelas enviadas.'; })
  .catch(function(e){ r.className='resultado err'; r.textContent='Falha: ' + e.message; });

function baixarCsv(){
  var lin = 'codigo;nome;telefone;link\n';
  for(var i=0;i<cartelas.length;i++){
    var c = cartelas[i];
    lin += c.codigo + ';' + (c.nome||'') + ';' + (c.telefone||'') + ';' + linkDe(c) + '\n';
  }
  var blob = new Blob(['\ufeff' + lin], {type:'text/csv;charset=utf-8;'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'cartelas-bingo-' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

/* ================= MODO JOGADOR ================= */
function lerHash(){
  var h = location.hash.replace(/^#/,'');
  if(!h) return null;
  var partes = {};
  h.split('&').forEach(function(kv){
    var p = kv.split('=');
    if(p[0]) partes[p[0]] = p[1];
  });
  if(!partes.g) return null;
  var nums = partes.g.split('.').map(Number);
  if(nums.length !== 24) return null;
  var grid = [], idx = 0;
  for(var r=0;r<5;r++){
    grid[r] = [];
    for(var k=0;k<5;k++){
      grid[r][k] = (r===2 && k===2) ? null : nums[idx++];
    }
  }
  return {codigo: partes.c ? decodeURIComponent(partes.c) : '', grid: grid};
}

function validarBingo(codFixo){
  var res = document.getElementById('resBingo');
  var mini = document.getElementById('miniBingo');
  if(!res) return;

  var cod;
  if(codFixo) cod = String(codFixo);
  else{
    var campo = document.getElementById('codBingo');
    cod = ((campo ? campo.value : '') || '').trim();
    if(cod.length && cod.length < 3) cod = ('000' + cod).slice(-3);
  }

  var c = null;
  for(var i=0;i<cartelas.length;i++){
    if(cartelas[i].codigo === cod){ c = cartelas[i]; break; }
  }
  if(!c){
    res.className = 'resultado err';
    res.innerHTML = 'CARTELA NÃO ENCONTRADA<small>Confira o código impresso no canto da cartela.</small>';
    if(mini) mini.innerHTML = '';
    return;
  }

  var set = {};
  for(var j=0;j<S.sorteados.length;j++) set[S.sorteados[j].n] = 1;
  var r = analisar(c.nums, set, S.padrao);
  var quem = (c.nome||'').trim();

  if(r.valido){
    res.className = 'resultado ok';
    res.innerHTML = '✅ BINGO VÁLIDO<small>' +
      (quem ? '<b>' + quem + '</b> — cartela ' + c.codigo : 'Cartela ' + c.codigo) +
      ' completou ' + NOME_PADRAO[S.padrao] + '.</small>';

    var roda = document.getElementById('mRodape');
    if(roda && !roda.querySelector('.encerrar')){
      var el = document.createElement('button');
      el.className = 'btn encerrar';
      el.textContent = 'Encerrar rodada e premiar';
      el.style.borderColor = '#1e8e3e';
      el.style.color = '#5ddc85';
      el.onclick = function(){ fecharModal(); abrirNovaRodada(); };
      roda.appendChild(el);
    }
    if(S.vozAlerta && temSintese){
      falarCurto('Bingo confirmado! ' + (quem ? (quem + ' é o campeão!') : 'Temos um campeão!'));
    }
    somBingo();
  }else{
    res.className = 'resultado err';
    res.innerHTML = '❌ BINGO INVÁLIDO<small>Faltam: ' +
      (r.nums.length ? r.nums.join(', ') : '—') + '. Continue o jogo.</small>';
    if(S.vozAlerta && temSintese){
      falarCurto('Ainda não. Faltam ' + r.nums.length +
        (r.nums.length === 1 ? ' número.' : ' números.'));
    }
  }
  if(mini) mini.innerHTML = minicartela(c.nums, set);
}
function minicartela(nums, set){
  var h = '<div class="minicart">';
  for(var i=0;i<nums.length;i++){
    var v = nums[i];
    if(v === null) h += '<div class="livre">' + logoImg() + '</div>';
    else if(set[v]) h += '<div class="mk">' + v + '</div>';
    else h += '<div>' + v + '</div>';
  }
  return h + '</div>';
}

/* ================= MAIS PERTO ================= */
function abrirQuentes(){
  if(!cartelas.length){
    abrirModal('Cartelas mais próximas',
      '<p>Nenhuma cartela gerada ainda.</p><p class="aviso">Gere as cartelas primeiro.</p>', []);
    return;
  }
  if(!S.sorteados.length){
    abrirModal('Cartelas mais próximas','<p>Nenhum número sorteado ainda.</p>', []);
    return;
  }
  var set = {};
  for(var i=0;i<S.sorteados.length;i++) set[S.sorteados[i].n] = 1;

  var lista = [];
  for(var k=0;k<cartelas.length;k++){
    var r = analisar(cartelas[k].nums, set, S.padrao);
    lista.push({
      codigo: cartelas[k].codigo,
      nome: (cartelas[k].nome||'').trim(),
      faltam: r.faltam,
      nums: r.nums
    });
  }
  lista.sort(function(a,b){ return a.faltam - b.faltam; });

  var h = '<p>Padrão: <b>' + NOME_PADRAO[S.padrao] + '</b> · ' +
    S.sorteados.length + ' sorteados · ' + cartelas.length + ' cartelas</p>' +
    '<table class="quentes"><thead><tr><th>Cartela</th><th>Nome</th>' +
    '<th>Falta</th><th></th></tr></thead><tbody>';

  for(var q=0; q<Math.min(15, lista.length); q++){
    var x = lista[q];
    var cls = x.faltam <= 1 ? 'q1' : (x.faltam === 2 ? 'q2' : '');
    var txt = x.faltam === 0 ? 'BINGO' : (x.faltam === 1 ? 'falta 1' : 'faltam ' + x.faltam);
    h += '<tr><td>' + x.codigo + '</td>' +
      '<td class="nm">' + (x.nome || '—') + '</td>' +
      '<td class="n">' + (x.nums.length ? x.nums.join(', ') : '') + '</td>' +
      '<td class="f ' + cls + '">' + txt + '</td></tr>';
  }
  h += '</tbody></table>';
  if(cartelas.length > 15){
    h += '<p class="aviso">Mostrando as 15 mais próximas de ' + cartelas.length + '.</p>';
  }
  abrirModal('Cartelas mais próximas', h, []);
}

/* ================= HISTÓRICO ================= */
function abrirHistorico(){
  var h;
  if(!S.sorteados.length){
    h = '<p>Nenhum número sorteado ainda.</p>';
  }else{
    h = '<table class="hist"><thead><tr><th>#</th><th>Pedra</th>' +
      '<th>Hora</th></tr></thead><tbody>';
    for(var i=0;i<S.sorteados.length;i++){
      var x = S.sorteados[i];
      var hora = new Date(x.hora).toLocaleTimeString('pt-BR',
        {hour:'2-digit',minute:'2-digit',second:'2-digit'});
      h += '<tr><td>' + (i+1) + '</td><td><b>' + x.letra + ' ' + x.n +
        '</b></td><td>' + hora + '</td></tr>';
    }
    h += '</tbody></table>';
  }
  abrirModal('Histórico de sorteios', h, []);
}

/* ================= BACKUP ================= */
function exportarBackup(){
  if(!S.sorteados.length && !cartelas.length){
    abrirModal('Backup','<p>Não há nada para salvar ainda — nenhum número sorteado e nenhuma cartela gerada.</p>',[]);
    return;
  }
  var pacote = {
    app:'Bingo do CEMTEC',
    versao:5,
    geradoEm:new Date().toISOString(),
    estado:{
      fila:S.fila, sorteados:S.sorteados, atual:S.atual,
      padrao:S.padrao, som:S.som, voz:S.voz,
      vozAlerta:S.vozAlerta, travaFala:S.travaFala,
      modoPassador:S.modoPassador, pausado:S.pausado,
      velocidade:S.velocidade, vozNome:S.vozNome
    },
    cartelas: cartelas.map(function(c){
      return {codigo:c.codigo, nome:c.nome||'', telefone:c.telefone||'', nums:c.nums};
    }),
    proximoCodigo: proximoCodigo
  };
  var blob = new Blob([JSON.stringify(pacote,null,2)], {type:'application/json;charset=utf-8;'});
  var a = document.createElement('a');
  var d = new Date();
  var stamp = d.getFullYear() + '-' +
    String(d.getMonth()+1).padStart(2,'0') + '-' +
    String(d.getDate()).padStart(2,'0') + '_' +
    String(d.getHours()).padStart(2,'0') + 'h' +
    String(d.getMinutes()).padStart(2,'0');
  a.href = URL.createObjectURL(blob);
  a.download = 'backup-bingo-cemtec-' + stamp + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
  abrirModal('Backup salvo',
    '<p>Arquivo gerado com <b>' + S.sorteados.length + ' números sorteados</b> e <b>' +
    cartelas.length + ' cartelas</b>.</p>', []);
}
function abrirBackup(){
  abrirModal('Backup do jogo',
    '<p>O backup guarda <b>tudo</b> num único arquivo: os números já sorteados, ' +
    'os 75 da fila, as cartelas geradas, nomes e telefones.</p>' +
    '<p class="aviso"><b>Exportar</b> — gera o arquivo para guardar.</p>' +
    '<p class="aviso"><b>Importar</b> — restaura um arquivo salvo. ' +
    'Atenção: isso substitui o que está aberto agora.</p>',
    [
      {r:'Fechar', a:fecharModal},
      {r:'⬇ Importar', a:function(){
        fecharModal();
        document.getElementById('inpBackup').click();
      }},
      {r:'⬆ Exportar', a:function(){ fecharModal(); exportarBackup(); }}
    ]);
}
var inpBackup = document.getElementById('inpBackup');
inpBackup.addEventListener('change', function(ev){
  var f = ev.target.files && ev.target.files[0];
  if(!f) return;
  var rd = new FileReader();
  rd.onload = function(){
    try{
      var p = JSON.parse(rd.result);
      if(!p || !p.estado || !(p.estado.fila instanceof Array)) throw new Error('formato');
      aplicarBackup(p);
      abrirModal('Importado',
        '<p>Backup restaurado: <b>' + (p.estado.sorteados||[]).length +
        ' números</b> e <b>' + (p.cartelas||[]).length + ' cartelas</b>.</p>', []);
    }catch(err){
      abrirModal('Arquivo inválido',
        '<p>Este arquivo não é um backup do Bingo do CEMTEC, ou está corrompido.</p>', []);
    }
    ev.target.value = '';
  };
  rd.readAsText(f, 'utf-8');
});
function aplicarBackup(p){
  var e = p.estado || {};
  S.fila = (e.fila instanceof Array) ? e.fila.slice() : novaFila();
  S.sorteados = (e.sorteados instanceof Array) ? e.sorteados.slice() : [];
  S.atual = (typeof e.atual === 'number') ? e.atual : null;
  S.padrao = e.padrao || 'cantos';
  S.som = e.som !== false;
  S.voz = !!e.voz;
  S.vozAlerta = e.vozAlerta !== false;
  S.travaFala = e.travaFala !== false;
  S.modoPassador = false;
  S.pausado = false;
  S.velocidade = e.velocidade || 0.8;
  S.vozNome = e.vozNome || '';

  cartelas = (p.cartelas||[]).map(function(c){
    return {codigo:c.codigo, nome:c.nome||'', telefone:c.telefone||'', nums:c.nums};
  });
  proximoCodigo = p.proximoCodigo || cartelas.length;

  var ja = {};
  for(var i=0;i<S.sorteados.length;i++) ja[S.sorteados[i].n] = 1;
  S.fila = S.fila.filter(function(n){ return !ja[n]; });

  salvar();
  montarPlacar();
  pintar(S.atual !== null);
  btnSom.classList.toggle('on', S.som);
  btnVoz.classList.toggle('on', S.voz);
  btnAlerta.classList.toggle('alertaOn', S.vozAlerta);
  pintarBtnTrava();
  pintarBtnPassador();
  btnBingo.classList.remove('ativo');
  placar.classList.remove('parado');
  document.getElementById('selPadrao').value = S.padrao;
  document.getElementById('selVeloc').value = String(S.velocidade);
  atualizarTravaUI();
  inicializarVozes();
  setTimeout(function(){ ajustarTamanho(); avaliarAlerta(); }, 80);
}

/* ================= NOVA RODADA ================= */

/* ================= TELA CHEIA ================= */
function estaFullscreen(){
  return !!(document.fullscreenElement ||
            document.webkitFullscreenElement ||
            document.msFullscreenElement);
}
function alternarFullscreen(){
  try{
    if(!estaFullscreen()){
      var el = document.documentElement;
      var req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
      if(!req){
        abrirModal('Tela cheia indisponível',
          '<p>Este navegador não permite tela cheia por botão.</p>' +
          '<p class="aviso">Use F11 no teclado.</p>', []);
        return;
      }
      req.call(el);
    }else{
      var exit = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
      if(exit) exit.call(document);
    }
  }catch(e){
    abrirModal('Tela cheia indisponível','<p>O navegador não autorizou.</p>',[]);
  }
}
function atualizarIconeFull(){
  var ico = document.getElementById('icoFull');
  var btn = document.getElementById('btnFull');
  if(!ico || !btn) return;
  if(estaFullscreen()){
    ico.innerHTML =
      '<path d="M8 3v3a2 2 0 0 1-2 2H3"></path>' +
      '<path d="M16 3v3a2 2 0 0 0 2 2h3"></path>' +
      '<path d="M8 21v-3a2 2 0 0 0-2-2H3"></path>' +
      '<path d="M16 21v-3a2 2 0 0 1 2-2h3"></path>';
    btn.title = 'Sair da tela cheia';
    btn.classList.add('on');
  }else{
    ico.innerHTML =
      '<path d="M8 3H5a2 2 0 0 0-2 2v3"></path>' +
      '<path d="M16 3h3a2 2 0 0 1 2 2v3"></path>' +
      '<path d="M8 21H5a2 2 0 0 1-2-2v-3"></path>' +
      '<path d="M16 21h3a2 2 0 0 0 2-2v-3"></path>';
    btn.title = 'Tela cheia';
    btn.classList.remove('on');
  }
  setTimeout(ajustarTamanho, 120);
}
['fullscreenchange','webkitfullscreenchange','msfullscreenchange']
  .forEach(function(ev){ document.addEventListener(ev, atualizarIconeFull); });

/* ================= MODO PASSADOR ================= */

}

}

/* ================= BOTÕES DOS MODAIS ================= */
var overlay = document.getElementById('overlay');
var modalBox = document.getElementById('modalBox');
var mTitulo = document.getElementById('mTitulo');
var mCorpo  = document.getElementById('mCorpo');
var mRodape = document.getElementById('mRodape');

function abrirModal(titulo, corpoHtml, botoes, ehBingo){
  mTitulo.textContent = titulo;
  mCorpo.innerHTML = corpoHtml;
  mRodape.innerHTML = '';
  modalBox.classList.toggle('bingoM', !!ehBingo);
  (botoes||[]).forEach(function(b){
    var el = document.createElement('button');
    el.className = 'btn';
    el.textContent = b.r;
    el.onclick = b.a;
    mRodape.appendChild(el);
  });
  if(!botoes || !botoes.length){
    var el2 = document.createElement('button');
    el2.className = 'btn';
    el2.textContent = 'Fechar';
    el2.onclick = fecharModal;
    mRodape.appendChild(el2);
  }
  overlay.classList.add('show');
  var primeiro = mCorpo.querySelector('input');
  if(primeiro && !ehBingo) setTimeout(function(){ primeiro.focus(); }, 60);
}
function fecharModal(){ overlay.classList.remove('show'); }
overlay.addEventListener('click', function(e){
  if(e.target === overlay) fecharModal();
});

}

document.getElementById('btnSortear').onclick = sortear;
btnBingo.onclick = function(){

};

var btnSom = document.getElementById('btnSom');
btnSom.onclick = function(){

  btnSom.classList.toggle('on', S.som);

        'adicionar voz em Português (Brasil).</p>' +

var TECLAS_SORTEIO = ['Space','PageDown','ArrowRight','Enter','NumpadEnter'];

document.addEventListener('keydown', function(e){
  if(S.modoPassador){
    if(e.ctrlKey && e.shiftKey && (e.key === 'L' || e.key === 'l')){
      e.preventDefault(); desativarPassador(); return;
    }
    if(e.code === 'KeyB'){
      e.preventDefault();
      if(!e.repeat) btnBingo.click();
      return;
    }
    if(TECLAS_SORTEIO.indexOf(e.code) !== -1){
      e.preventDefault();
      if(!e.repeat) sortear();
      return;
    }
    e.preventDefault();
    e.stopPropagation();
    return;
  }
  var aberto = overlay.classList.contains('show');
  if(e.key === 'Escape'){ if(aberto) fecharModal(); return; }
  if(aberto) return;
  if(e.repeat) return;
  if(TECLAS_SORTEIO.indexOf(e.code) !== -1){
    e.preventDefault();
    sortear();
    return;
  }
  var k = (e.key || '').toLowerCase();
  if(k === 'b') btnBingo.click();
  else if(k === 'f') alternarFullscreen();
  else if(k === 'h') abrirHistorico();
  else if(k === 'q') abrirQuentes();
  else if(k === 'n') abrirNovaRodada();
  else if(k === 'm') btnSom.click();
  else if(k === 'v') btnVoz.click();
  else if(k === 'a') btnAlerta.click();
  else if(k === 'p') btnPassador.click();
  else if(k === 't') btnTrava.click();
});

window.addEventListener('beforeunload', function(e){
  if(S.sorteados.length > 0 && !S.modoPassador){
    e.preventDefault();
    e.returnValue = '';
  }
});

/* ================= INICIALIZAÇÃO ================= */
(function init(){
  restaurar();
  montarPlacar();
  pintar(S.atual !== null);
  btnSom.classList.toggle('on', S.som);
  btnVoz.classList.toggle('on', S.voz);
  pintarBtnAlerta();
  pintarBtnPassador();
  pintarBtnTrava();
  selPadrao.value = S.padrao;
  selVeloc.value = String(S.velocidade);

  if(!S.fila || !S.fila.length){
    if(!S.sorteados.length){ S.fila = novaFila(); salvar(); }
  }

  inicializarVozes();
  atualizarIconeFull();
  atualizarTravaUI();

  if(S.pausado){
    btnBingo.classList.add('ativo');
    placar.classList.add('parado');
    contadorEl.className = 'pill bingo';
  }
  if(!temSintese){
    btnVoz.disabled = true; btnVoz.style.opacity = '.35';
    btnAlerta.disabled = true; btnAlerta.style.opacity = '.35';
    selVoz.disabled = true;
  }

  var jog = lerHash();
  if(jog) abrirJogador(jog);

  setTimeout(function(){ ajustarTamanho(); avaliarAlerta(); }, 60);
  setTimeout(ajustarTamanho, 350);
  setTimeout(ajustarTamanho, 900);

  window.addEventListener('hashchange', function(){
    var j = lerHash();
    if(j) abrirJogador(j);
  });
})();
